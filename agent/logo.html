<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK금융그룹 로고 다운로드</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');
@font-face {
  font-family:'OKLight';
  src:url(/imagesAI/fonts/Ok-Light.woff) format('woff');
  font-weight:300;font-style:normal;font-display:swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ok: #e07d08;
  --ok2: #f5aa20;
  --ok3: #bf5500;
  --okglow: rgba(224,125,8,0.35);
  --okglow2: rgba(224,125,8,0.12);
  --text: rgba(255,225,180,0.92);
  --dim: rgba(200,140,60,0.55);
  --dim2: rgba(200,140,60,0.22);
  --bg: #06070d;
  --surface: #0B0D14;
  --border: rgba(200,140,60,0.22);
  --text-muted: rgba(255,225,180,0.55);
  --text-dim: rgba(200,140,60,0.4);
  --radius-sm: 8px;
  --max-w: 960px;
}

html, body { height: 100%; }
body {
  font-family: 'OKLight', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow-x: hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:300;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
}
.hud-corner{position:fixed;z-index:250;width:36px;height:36px;pointer-events:none;}
.hud-corner.tl{top:16px;left:16px;border-top:1.5px solid var(--ok);border-left:1.5px solid var(--ok);}
.hud-corner.tr{top:16px;right:16px;border-top:1.5px solid var(--ok);border-right:1.5px solid var(--ok);}
.hud-corner.bl{bottom:16px;left:16px;border-bottom:1.5px solid var(--ok);border-left:1.5px solid var(--ok);}
.hud-corner.br{bottom:16px;right:16px;border-bottom:1.5px solid var(--ok);border-right:1.5px solid var(--ok);}
.hud-corner::before,.hud-corner::after{content:'';position:absolute;background:var(--ok);opacity:0.5;}
.hud-corner.tl::before{top:-1px;left:8px;width:4px;height:1px;}
.hud-corner.tl::after{top:8px;left:-1px;width:1px;height:4px;}
.hud-corner.tr::before{top:-1px;right:8px;width:4px;height:1px;}
.hud-corner.tr::after{top:8px;right:-1px;width:1px;height:4px;}
.hud-corner.bl::before{bottom:-1px;left:8px;width:4px;height:1px;}
.hud-corner.bl::after{bottom:8px;left:-1px;width:1px;height:4px;}
.hud-corner.br::before{bottom:-1px;right:8px;width:4px;height:1px;}
.hud-corner.br::after{bottom:8px;right:-1px;width:1px;height:4px;}

#hudTop{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:20px 40px 0;box-sizing:border-box;
  position:relative;z-index:60;flex-shrink:0;
}
.hud-label{
  font-family:'Orbitron',monospace;font-size:11px;letter-spacing:0.2em;
  color:rgba(200,140,60,0.8);text-transform:uppercase;
}
.hud-brand{
  position:absolute; left:50%; transform:translateX(-50%);
  font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:0.3em;
  color:var(--ok);text-shadow:0 0 14px var(--okglow);white-space:nowrap;
}
.hud-status{display:flex;align-items:center;gap:7px;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:0.18em;color:var(--ok);}
.hud-status .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--okglow);animation:hudblink 1.6s ease-in-out infinite;}
@keyframes hudblink{0%,100%{opacity:1;}50%{opacity:0.15;}}

header {
  width: 100%;
  padding: 20px 40px 20px;
  border-bottom: 1px solid var(--border);
  box-sizing: border-box;
  position: relative; z-index: 60; flex-shrink: 0;
}
.header-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
}
.header-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 12px var(--ok);
  flex-shrink: 0;
  margin-bottom: 4px;
  animation: hudblink 1.6s ease-in-out infinite;
}
.header-title { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
.header-sub { font-size: 11px; color: var(--dim); font-family:'Orbitron',monospace; letter-spacing: 0.1em; text-transform: uppercase; }
.header-count { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-top: 4px; }

.search-wrap {
  width: 100%;
  padding: 18px 40px 0;
  display: flex;
  justify-content: center;
  box-sizing: border-box;
  position: relative; z-index: 60; flex-shrink: 0;
}
.search-box { position: relative; width: 100%; max-width: 420px; }
.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px 10px 40px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { border-color: var(--ok); box-shadow: 0 0 0 3px var(--okglow2); }
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim); pointer-events: none;
}
.search-clear {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--text-dim); cursor: pointer;
  font-size: 16px; line-height: 1; display: none;
}
.search-clear.show { display: block; }

/* ── 로고들이 떠다니는 공간 ───────────────────────── */
.space {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 420px;
  overflow: hidden;
}
.space-empty{
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center;
  color: var(--text-dim); font-size: 13px; font-family:'OKLight','Pretendard',sans-serif;
  z-index: 5;
}
.space-empty.show{ display:flex; }

.orb{
  position: absolute;
  width: 92px; height: 92px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  cursor: pointer;
  box-shadow: 0 4px 22px rgba(0,0,0,.45);
  transition: border-color .25s ease, box-shadow .25s ease, opacity .3s ease, filter .3s ease;
}
.orb img{ max-width: 100%; max-height: 100%; object-fit: contain; }
.orb .no-img{ font-size: 10px; color: var(--text-dim); text-align: center; }
.orb-inner{
  transition: transform .2s ease;
}
.orb:hover{ border-color: var(--ok); box-shadow: 0 0 26px var(--okglow); z-index: 20; }
.orb:hover .orb-inner{ transform: scale(1.1); }
.orb-label{
  position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%) translateY(8px);
  font-size: 11px; color: var(--text);
  background: rgba(6,7,13,.9); border: 1px solid var(--dim2);
  padding: 4px 11px; border-radius: 20px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.orb:hover .orb-label{ opacity: 1; }
.orb.dimmed{ opacity: .1; filter: grayscale(1); pointer-events: none; }
.orb.matched{ border-color: var(--ok2); box-shadow: 0 0 20px var(--okglow2); }
.orb.grabbed{ animation: grabPulse .5s ease; border-color: #2f7a4a !important; box-shadow: 0 0 24px rgba(47,122,74,.5) !important; }
@keyframes grabPulse{ 0%{ transform: scale(1); } 45%{ transform: scale(1.18); } 100%{ transform: scale(1); } }
.orb-check{
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center;
  background: rgba(6,7,13,.7); border-radius: 50%;
  color:#6fcf97; font-size: 22px;
}
.orb.grabbed .orb-check{ display:flex; }
.orb.grabbed .orb-inner{ opacity: 0; }

.dl-all-btn {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  width: 220px; z-index: 60;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--ok); border: none; border-radius: 999px;
  padding: 13px 0; font-size: 14px; font-family: inherit; font-weight: 600;
  color: #06070d; cursor: pointer; transition: background .2s, opacity .2s, box-shadow .2s;
  box-shadow: 0 0 20px var(--okglow2);
}
.dl-all-btn:hover { background: var(--ok2); box-shadow: 0 0 28px var(--okglow); }
.dl-all-btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.dl-all-btn.done { background: #2f7a4a; color:#fff; box-shadow: none; }

.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--dim2); border-radius: 30px;
  padding: 10px 20px; font-size: 13px; color: #fff;
  pointer-events: none; transition: transform .3s ease, opacity .3s ease;
  opacity: 0; z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

@media (max-width: 700px) {
  #hudTop { padding: 16px 20px 0; }
  .hud-label, .hud-status { display: none; }
  header { padding: 16px 20px 16px; }
  .search-wrap { padding: 14px 20px 0; }
  .orb{ width: 72px; height: 72px; padding: 12px; }
  .dl-all-btn{ width: 200px; bottom: 20px; }
  .toast{ bottom: 78px; }
}
</style>
</head>
<body>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>
<div id="hudTop">
  <span class="hud-label">OK · LOGO ARCHIVE</span>
  <span class="hud-brand">OKNEXUS</span>
  <span class="hud-status"><span class="dot"></span>ONLINE</span>
</div>

<header>
  <div class="header-inner">
    <div class="header-dot"></div>
    <div class="header-title">OK금융그룹 로고 다운로드</div>
    <div class="header-sub">Logo Download System</div>
    <div class="header-count" id="countLabel">16개 브랜드</div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="브랜드명 검색 (예: 저축은행, 캐피탈…)" autocomplete="off">
    <button class="search-clear" id="searchClear" aria-label="검색 지우기">×</button>
  </div>
</div>

<div class="space" id="space">
  <div class="space-empty" id="spaceEmpty">검색 결과가 없습니다.</div>
</div>

<button class="dl-all-btn" id="dlAllBtn">
  <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path d="M12 3v13M5 14l7 7 7-7"/><path d="M3 21h18"/>
  </svg>
  전체 다운로드 (16개)
</button>

<div class="toast" id="toast" role="status"></div>

<script>
// ── 서버 경로 설정 ───────────────────────────────────
const IMG_BASE = '/imagesAI/logo/';        // 로고 이미지 폴더
const ZIP_BASE = '/imagesAI/logo/';          // ZIP 파일 폴더
const ALL_ZIP  = 'OK금융그룹_전체로고.zip';
// ─────────────────────────────────────────────────────

const BRANDS = [
  { id:'okgroup',        name:'OK금융그룹',               tags:['ok금융그룹','okgroup','금융그룹','그룹'],                   zip:'okgroup_ai.zip',          img:'ok_group.png' },
  { id:'okbank',         name:'OK저축은행',               tags:['ok저축은행','okbank','저축은행','저축'],                    zip:'okbank_ai.zip',           img:'ok_bank.png' },
  { id:'okcapital',      name:'OK캐피탈',                tags:['ok캐피탈','okcapital','캐피탈'],                         zip:'okcapital_ai.zip',        img:'ok_capital.png' },
  { id:'okholdings',     name:'OK홀딩스',                tags:['ok홀딩스','okholdings','홀딩스'],                        zip:'okholdings_ai.zip',       img:'ok_holdings.png' },
  { id:'okax',           name:'OK에이엑스',               tags:['ok에이엑스','okax','에이엑스'],                          zip:'okax_ai.zip',             img:'ok_ax.png' },
  { id:'okci',           name:'아프로신용정보',            tags:['아프로신용정보','okci','신용정보','아프로'],                 zip:'okci_ai.zip',             img:'ok_ci.png' },
  { id:'okfni',          name:'아프로에프앤아이대부',       tags:['아프로에프앤아이','okfni','에프앤아이','대부'],              zip:'okfni_ai.zip',            img:'ok_fni.png' },
  { id:'oknext',         name:'OK넥스트',                tags:['ok넥스트','oknext','넥스트'],                            zip:'oknext_ai.zip',           img:'ok_next.png' },
  { id:'okip',           name:'OK인베스트먼트파트너스',     tags:['ok인베스트먼트','okip','인베스트먼트','파트너스'],           zip:'okip_ai.zip',             img:'ok_ip.png' },
  { id:'oknetworks',     name:'OK네트웍스',               tags:['ok네트웍스','oknetworks','네트웍스'],                     zip:'oknetworks_ai.zip',       img:'ok_networks.png' },
  { id:'okbank_id',      name:'OKBANK 인도네시아',        tags:['okbank인도네시아','okbank indonesia','인도네시아'],        zip:'okbank_indonesia_ai.zip', img:'ok_bank_id.png' },
  { id:'okbigyo',        name:'OK비교대출',               tags:['ok비교대출','okbigyo','비교대출'],                        zip:'okbigyo_ai.zip',          img:'ok_bigyo.png' },
  { id:'okpay',          name:'OKPay',                  tags:['okpay','ok페이','페이'],                               zip:'okpay_ai.zip',            img:'ok_pay.png' },
  { id:'okschool',       name:'OK배·정장학재단',           tags:['ok장학재단','okschool','장학재단','배정장학'],              zip:'okschool_ai.zip',         img:'ok_school.png' },
  { id:'oksports',       name:'OK저축은행 읏맨 프로배구단', tags:['읏맨','배구단','oksports','프로배구'],                     zip:'oksports_ai.zip',         img:'ok_sports.png' },
  { id:'oksports_rugby', name:'OK저축은행 읏맨 럭비단',    tags:['럭비단','oksports_rugby','럭비'],                       zip:'oksports_rugby_ai.zip',   img:'ok_sports_rugby.png' },
];

function triggerDownload(url, filename) {
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function downloadAll() {
  const btn = document.getElementById('dlAllBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 다운로드 중…';
  triggerDownload(ZIP_BASE + ALL_ZIP, ALL_ZIP);
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 다운로드 완료';
  btn.classList.add('done');
  showToast('✓ 전체 로고 ZIP 다운로드 시작');
  setTimeout(() => {
    btn.disabled = false; btn.classList.remove('done');
    btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 3v13M5 14l7 7 7-7"/><path d="M3 21h18"/></svg> 전체 다운로드 (16개)';
  }, 3000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 로고를 잡으면(클릭하면) 바로 다운로드 ──────────────
function grabOrb(brand, el) {
  if (el.classList.contains('grabbed')) return;
  triggerDownload(ZIP_BASE + brand.zip, brand.zip);
  el.classList.add('grabbed');
  showToast(`✓ ${brand.name} 다운로드 시작`);
  setTimeout(() => el.classList.remove('grabbed'), 900);
}

// ── 떠다니는 오브 물리 엔진 ──────────────────────────
// 각 오브는 느린 속도로 떠다니다 공간 벽에 부딪히면 반사되고,
// 마우스가 다가오면 살짝 밀려나며, 호버 중엔 잠시 멈춰서 읽기 편하게 한다.
const space = document.getElementById('space');
const orbs = [];

function buildOrbs() {
  const rect = space.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const size = window.innerWidth <= 700 ? 72 : 92;
  const cols = Math.ceil(Math.sqrt(BRANDS.length * (w / Math.max(h, 1))));
  const rows = Math.ceil(BRANDS.length / cols);
  const cellW = w / cols, cellH = h / rows;

  BRANDS.forEach((b, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const jitterX = (Math.random() - 0.5) * (cellW * 0.4);
    const jitterY = (Math.random() - 0.5) * (cellH * 0.4);
    const x = Math.min(Math.max(col * cellW + cellW / 2 - size / 2 + jitterX, 4), Math.max(w - size - 4, 4));
    const y = Math.min(Math.max(row * cellH + cellH / 2 - size / 2 + jitterY, 4), Math.max(h - size - 4, 4));
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.12 + Math.random() * 0.16;

    const el = document.createElement('div');
    el.className = 'orb';
    el.dataset.id = b.id;
    el.innerHTML = `
      <div class="orb-inner">
        <img src="${IMG_BASE}${b.img}" alt="${b.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="no-img" style="display:none">미리보기<br>없음</span>
      </div>
      <div class="orb-check">✓</div>
      <span class="orb-label">${b.name}</span>
    `;
    el.addEventListener('click', () => grabOrb(b, el));
    el.addEventListener('mouseenter', () => { orb.paused = true; });
    el.addEventListener('mouseleave', () => { orb.paused = false; });
    space.appendChild(el);

    const orb = { brand: b, el, x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size, paused: false };
    orbs.push(orb);
  });
}

let mouseX = -9999, mouseY = -9999;
space.addEventListener('mousemove', e => {
  const rect = space.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});
space.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });

function tick() {
  const rect = space.getBoundingClientRect();
  const w = rect.width, h = rect.height;

  orbs.forEach(o => {
    if (!o.paused) {
      // 마우스 근처면 살짝 밀려남
      const cx = o.x + o.size / 2, cy = o.y + o.size / 2;
      const dx = cx - mouseX, dy = cy - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const repelRadius = 130;
      if (dist < repelRadius && dist > 0.01) {
        const force = (repelRadius - dist) / repelRadius * 0.06;
        o.vx += (dx / dist) * force;
        o.vy += (dy / dist) * force;
      }
      // 속도 제한(너무 빨라지지 않게)
      const maxV = 0.5;
      const v = Math.sqrt(o.vx * o.vx + o.vy * o.vy);
      if (v > maxV) { o.vx = (o.vx / v) * maxV; o.vy = (o.vy / v) * maxV; }

      o.x += o.vx;
      o.y += o.vy;

      if (o.x <= 0) { o.x = 0; o.vx = Math.abs(o.vx); }
      if (o.x >= w - o.size) { o.x = w - o.size; o.vx = -Math.abs(o.vx); }
      if (o.y <= 0) { o.y = 0; o.vy = Math.abs(o.vy); }
      if (o.y >= h - o.size) { o.y = h - o.size; o.vy = -Math.abs(o.vy); }

      o.el.style.left = o.x + 'px';
      o.el.style.top = o.y + 'px';
    }
  });
  requestAnimationFrame(tick);
}

window.addEventListener('resize', () => {
  const rect = space.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  orbs.forEach(o => {
    o.x = Math.min(o.x, Math.max(w - o.size, 0));
    o.y = Math.min(o.y, Math.max(h - o.size, 0));
  });
});

// ── 검색: 매칭되는 오브만 살리고 나머지는 흐리게 ────────
function applySearch(filter) {
  const q = filter.toLowerCase().trim();
  let matchCount = 0;
  orbs.forEach(o => {
    const matched = !q || o.brand.name.toLowerCase().includes(q) || o.brand.tags.some(t => t.toLowerCase().includes(q));
    o.el.classList.toggle('dimmed', !matched);
    o.el.classList.toggle('matched', !!q && matched);
    if (matched) matchCount++;
  });
  document.getElementById('countLabel').textContent =
    !q ? `${BRANDS.length}개 브랜드` : `${matchCount} / ${BRANDS.length}개`;
  document.getElementById('spaceEmpty').classList.toggle('show', matchCount === 0);
}

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', () => {
  searchClear.classList.toggle('show', searchInput.value.length > 0);
  applySearch(searchInput.value);
});
searchClear.onclick = () => { searchInput.value = ''; searchClear.classList.remove('show'); applySearch(''); searchInput.focus(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
});
document.getElementById('dlAllBtn').onclick = downloadAll;

buildOrbs();
requestAnimationFrame(tick);
</script>
