<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK금융그룹 로고 다운로드</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');
@font-face {
  font-family:'OKLight';
  src:url(/imagesAI/fonts/Ok-Light.woff) format('woff');
  font-weight:300;font-style:normal;font-display:swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ok: #e07d08;
  --ok2: #f5aa20;
  --ok3: #bf5500;
  --okglow: rgba(224,125,8,0.35);
  --okglow2: rgba(224,125,8,0.12);
  --text: rgba(255,225,180,0.92);
  --dim: rgba(200,140,60,0.55);
  --dim2: rgba(200,140,60,0.22);
  --bg: #06070d;
  --surface: #0B0D14;
  --border: rgba(200,140,60,0.22);
  --text-muted: rgba(255,225,180,0.55);
  --text-dim: rgba(200,140,60,0.4);
  --radius: 12px;
  --radius-sm: 8px;
  --max-w: 960px;
}

html {
  scroll-behavior: smooth;
  scrollbar-color: var(--ok) rgba(255,255,255,0.03);
  scrollbar-width: thin;
}

body {
  font-family: 'OKLight', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
/* ── 커스텀 스크롤바 ──────────────────────────────── */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{
  background: rgba(255,255,255,0.02);
  border-left: 1px solid var(--border);
}
::-webkit-scrollbar-thumb{
  background: linear-gradient(180deg, var(--ok2), var(--ok) 60%, var(--ok3));
  border-radius: 999px;
  border: 2px solid var(--bg);
  box-shadow: 0 0 8px var(--okglow2);
}
::-webkit-scrollbar-thumb:hover{
  background: linear-gradient(180deg, var(--ok2), var(--ok2) 60%, var(--ok));
  box-shadow: 0 0 12px var(--okglow);
}
::-webkit-scrollbar-corner{ background: transparent; }
body::before{
  content:'';position:fixed;inset:0;z-index:200;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
}
.hud-corner{position:fixed;z-index:150;width:36px;height:36px;pointer-events:none;}
.hud-corner.tl{top:16px;left:16px;border-top:1.5px solid var(--ok);border-left:1.5px solid var(--ok);}
.hud-corner.tr{top:16px;right:16px;border-top:1.5px solid var(--ok);border-right:1.5px solid var(--ok);}
.hud-corner.bl{bottom:16px;left:16px;border-bottom:1.5px solid var(--ok);border-left:1.5px solid var(--ok);}
.hud-corner.br{bottom:16px;right:16px;border-bottom:1.5px solid var(--ok);border-right:1.5px solid var(--ok);}
.hud-corner::before,.hud-corner::after{content:'';position:absolute;background:var(--ok);opacity:0.5;}
.hud-corner.tl::before{top:-1px;left:8px;width:4px;height:1px;}
.hud-corner.tl::after{top:8px;left:-1px;width:1px;height:4px;}
.hud-corner.tr::before{top:-1px;right:8px;width:4px;height:1px;}
.hud-corner.tr::after{top:8px;right:-1px;width:1px;height:4px;}
.hud-corner.bl::before{bottom:-1px;left:8px;width:4px;height:1px;}
.hud-corner.bl::after{bottom:8px;left:-1px;width:1px;height:4px;}
.hud-corner.br::before{bottom:-1px;right:8px;width:4px;height:1px;}
.hud-corner.br::after{bottom:8px;right:-1px;width:1px;height:4px;}

/* ── 위로 가기 버튼 ───────────────────────────────── */
#toTopBtn{
  position: fixed; right: 24px; bottom: 24px; z-index: 140;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--ok);
  color: var(--ok2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px var(--okglow2);
  opacity: 0; transform: translateY(12px) scale(.9);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease, box-shadow .2s, border-color .2s;
}
#toTopBtn.show{ opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
#toTopBtn:hover{ border-color: var(--ok2); box-shadow: 0 0 20px var(--okglow); }
#toTopBtn::before, #toTopBtn::after{
  content:''; position:absolute; width:8px; height:8px;
  border-top:1.5px solid var(--dim); opacity:.6;
}
#toTopBtn::before{ top:2px; left:2px; border-left:1.5px solid var(--dim); }
#toTopBtn::after{ top:2px; right:2px; border-right:1.5px solid var(--dim); transform:scaleX(-1); }

#hudTop{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:20px 40px 0;box-sizing:border-box;
}
.hud-label{
  font-family:'Orbitron',monospace;font-size:11px;letter-spacing:0.2em;
  color:rgba(200,140,60,0.8);text-transform:uppercase;
}
.hud-brand{
  font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:0.3em;
  color:var(--ok);text-shadow:0 0 14px var(--okglow);
  position: absolute; left: 50%; transform: translateX(-50%);
}
.hud-status{display:flex;align-items:center;gap:7px;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:0.18em;color:var(--ok);}
.hud-status .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--okglow);animation:hudblink 1.6s ease-in-out infinite;}
@keyframes hudblink{0%,100%{opacity:1;}50%{opacity:0.15;}}

/* ── 진입 애니메이션 ───────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes cornerDraw{
  from{opacity:0;transform:scale(.6);}
  to{opacity:1;transform:scale(1);}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes breathe{
  0%,100%{box-shadow:0 0 20px var(--okglow2);}
  50%{box-shadow:0 0 32px var(--okglow);}
}
@keyframes sweep{
  from{transform:translateX(-120%) skewX(-12deg);}
  to{transform:translateX(220%) skewX(-12deg);}
}
@keyframes countFlash{
  0%{opacity:0.3;transform:translateY(2px);}
  100%{opacity:1;transform:translateY(0);}
}

.hud-corner{animation:cornerDraw .5s ease both;}
.hud-corner.tl{animation-delay:.05s;}
.hud-corner.tr{animation-delay:.1s;}
.hud-corner.bl{animation-delay:.15s;}
.hud-corner.br{animation-delay:.2s;}

#hudTop{opacity:0;animation:fadeUp .5s ease .1s both;}
header{opacity:0;animation:fadeUp .5s ease .22s both;}
.search-wrap{opacity:0;animation:fadeUp .5s ease .34s both;}
.dl-all-wrap{opacity:0;animation:fadeUp .5s ease .3s both;}

header {
  width: 100%;
  padding: 28px 40px 24px;
  border-bottom: 1px solid var(--border);
  box-sizing: border-box;
}
.header-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
}
.header-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 12px var(--ok);
  flex-shrink: 0;
  margin-bottom: 4px;
  animation: hudblink 1.6s ease-in-out infinite;
}
.header-title { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
.header-sub { font-size: 11px; color: var(--dim); font-family:'Orbitron',monospace; letter-spacing: 0.1em; text-transform: uppercase; }
.header-count { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-top: 4px; display:inline-block; }
.header-count.flash { animation: countFlash .3s ease; }

.search-wrap {
  width: 100%;
  padding: 24px 40px 0;
  display: flex;
  justify-content: center;
  box-sizing: border-box;
}
.search-box { position: relative; width: 100%; max-width: 480px; }
.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 16px 11px 44px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { border-color: var(--ok); }
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim); pointer-events: none;
}
.search-clear {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--text-dim); cursor: pointer;
  font-size: 16px; line-height: 1; display: none;
}
.search-clear.show { display: block; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  padding: 24px 40px 0;
  max-width: var(--max-w);
  width: 100%;
  box-sizing: border-box;
}

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .15s;
  opacity: 0;
  animation: cardIn .45s cubic-bezier(.22,.9,.32,1) both;
}
.card::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(100deg,transparent 40%,var(--okglow2) 50%,transparent 60%);
  transform:translateX(-120%) skewX(-12deg);
  opacity:0;transition:opacity .15s;
}
.card:hover::after{ opacity:1; animation:sweep .9s ease; }
.card:hover {
  border-color: var(--ok);
  box-shadow: 0 4px 20px var(--okglow2);
  transform: translateY(-2px);
}
.card-thumb {
  height: 120px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); padding: 16px;
  overflow: hidden;
}
.card-thumb img { max-width: 100%; max-height: 88px; object-fit: contain; transition: transform .3s ease; }
.card:hover .card-thumb img { transform: scale(1.06); }
.card-thumb .no-img { font-size: 11px; color: var(--text-dim); }
.card-info { padding: 12px 14px; border-top: 1px solid var(--border); }
.card-name { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.4; }
.card-dl {
  margin-top: 10px; width: 100%;
  background: transparent; border: 1px solid var(--ok); border-radius: 999px;
  padding: 8px 0; font-size: 12px; font-family: inherit; font-weight: 500;
  color: var(--ok2); cursor: pointer; transition: background .2s, border-color .2s, opacity .2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.card-dl:hover { background: var(--okglow2); box-shadow: 0 0 12px var(--okglow2); }
.card-dl:disabled { opacity: .5; cursor: default; }
.card-dl.done { background: rgba(47,122,74,0.15); border-color: #2f7a4a; color:#6fcf97; }

.empty {
  grid-column: 1/-1; padding: 80px 0;
  text-align: center; color: var(--text-dim); font-size: 14px;
}

.dl-all-wrap {
  padding: 40px;
  max-width: var(--max-w); width: 100%; box-sizing: border-box;
}
.dl-all-btn {
  width: 220px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--ok); border: none; border-radius: 999px;
  padding: 13px 0; font-size: 14px; font-family: inherit; font-weight: 600;
  color: #06070d; cursor: pointer; transition: background .2s, opacity .2s, box-shadow .2s;
  box-shadow: 0 0 20px var(--okglow2);
}
.dl-all-btn:hover { background: var(--ok2); box-shadow: 0 0 28px var(--okglow); animation: none; }
.dl-all-btn:disabled { opacity: .5; cursor: default; box-shadow: none; animation: none; }
.dl-all-btn.done { background: #2f7a4a; color:#fff; box-shadow: none; animation: none; }
.dl-all-btn:not(:disabled):not(.done) { animation: breathe 2.6s ease-in-out infinite; }

.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .18s ease;
}
.modal-bg.open { display: flex; opacity: 1; }
@keyframes checkPop{
  0%{transform:scale(.6);opacity:0;}
  60%{transform:scale(1.15);opacity:1;}
  100%{transform:scale(1);}
}
.card-dl.done svg, .modal-btn-dl svg, .dl-all-btn svg { transition: transform .2s; }
.card-dl.done, .dl-all-btn.done { animation: checkPop .25s ease; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; width: min(480px, 92vw);
  overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  animation: modalIn .2s ease;
}
@keyframes modalIn {
  from { opacity:0; transform: scale(.96) translateY(8px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}
.modal-head {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head-name { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 24px; }
.modal-preview {
  width: 100%; height: 140px; background: var(--bg);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.modal-preview img { max-width: 100%; max-height: 110px; object-fit: contain; }
.modal-info { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.7; }
.modal-info span { color: var(--text-dim); }
.modal-btn-dl {
  width: 100%; background: var(--ok); border: none; border-radius: 999px;
  padding: 14px 0; font-size: 14px; font-family: inherit; font-weight: 600;
  color: #06070d; cursor: pointer; transition: background .2s, box-shadow .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 0 20px var(--okglow2);
}
.modal-btn-dl:hover { background: var(--ok2); box-shadow: 0 0 28px var(--okglow); }
.modal-btn-dl:disabled { opacity: .5; cursor: default; box-shadow: none; }

.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--dim2); border-radius: 30px;
  padding: 10px 20px; font-size: 13px; color: #fff;
  pointer-events: none; transition: transform .3s ease, opacity .3s ease;
  opacity: 0; z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

@media (max-width: 700px) {
  #hudTop { padding: 16px 20px 0; }
  .hud-label, .hud-status { display: none; }
  header { padding: 20px 20px 16px; }
  .search-wrap { padding: 16px 20px 0; }
  .grid { padding: 16px 20px 0; gap: 10px; grid-template-columns: repeat(2, 1fr); }
  .dl-all-wrap { padding: 16px 20px 40px; }
}
</style>
</head>
<body>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>
<div id="hudTop">
  <span class="hud-label">OK · LOGO ARCHIVE</span>
  <span class="hud-brand">OKNEXUS</span>
  <span class="hud-status"><span class="dot"></span>ONLINE</span>
</div>

<header>
  <div class="header-inner">
    <div class="header-dot"></div>
    <div>
      <div class="header-title">OK금융그룹 로고 다운로드</div>
      <div class="header-sub">Logo Download System</div>
    </div>
    <div class="header-count" id="countLabel">16개 브랜드</div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="브랜드명 검색 (예: 저축은행, 캐피탈…)" autocomplete="off">
    <button class="search-clear" id="searchClear" aria-label="검색 지우기">×</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="dl-all-wrap">
  <button class="dl-all-btn" id="dlAllBtn">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path d="M12 3v13M5 14l7 7 7-7"/><path d="M3 21h18"/>
    </svg>
    전체 다운로드 (16개)
  </button>
</div>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-head-name" id="modalName"></span>
      <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-preview"><img id="modalImg" src="" alt=""></div>
      <div class="modal-info" id="modalInfo"></div>
      <button class="modal-btn-dl" id="modalDlBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M12 3v13M5 14l7 7 7-7"/><path d="M3 21h18"/>
        </svg>
        ZIP 다운로드
      </button>
    </div>
  </div>
</div>

<button id="toTopBtn" aria-label="맨 위로">
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<div class="toast" id="toast" role="status"></div>

<script>
// ── 서버 경로 설정 ───────────────────────────────────
const IMG_BASE = '/imagesAI/logo/';        // 로고 이미지 폴더
const ZIP_BASE = '/imagesAI/logo/';          // ZIP 파일 폴더
const ALL_ZIP  = 'OK금융그룹_전체로고.zip';
// ─────────────────────────────────────────────────────

const BRANDS = [
  { id:'okgroup',        name:'OK금융그룹',               tags:['ok금융그룹','okgroup','금융그룹','그룹'],                   zip:'okgroup_ai.zip',          img:'ok_group.png' },
  { id:'okbank',         name:'OK저축은행',               tags:['ok저축은행','okbank','저축은행','저축'],                    zip:'okbank_ai.zip',           img:'ok_bank.png' },
  { id:'okcapital',      name:'OK캐피탈',                tags:['ok캐피탈','okcapital','캐피탈'],                         zip:'okcapital_ai.zip',        img:'ok_capital.png' },
  { id:'okholdings',     name:'OK홀딩스',                tags:['ok홀딩스','okholdings','홀딩스'],                        zip:'okholdings_ai.zip',       img:'ok_holdings.png' },
  { id:'okax',           name:'OK에이엑스',               tags:['ok에이엑스','okax','에이엑스'],                          zip:'okax_ai.zip',             img:'ok_ax.png' },
  { id:'okci',           name:'아프로신용정보',            tags:['아프로신용정보','okci','신용정보','아프로'],                 zip:'okci_ai.zip',             img:'ok_ci.png' },
  { id:'okfni',          name:'아프로에프앤아이대부',       tags:['아프로에프앤아이','okfni','에프앤아이','대부'],              zip:'okfni_ai.zip',            img:'ok_fni.png' },
  { id:'oknext',         name:'OK넥스트',                tags:['ok넥스트','oknext','넥스트'],                            zip:'oknext_ai.zip',           img:'ok_next.png' },
  { id:'okip',           name:'OK인베스트먼트파트너스',     tags:['ok인베스트먼트','okip','인베스트먼트','파트너스'],           zip:'okip_ai.zip',             img:'ok_ip.png' },
  { id:'oknetworks',     name:'OK네트웍스',               tags:['ok네트웍스','oknetworks','네트웍스'],                     zip:'oknetworks_ai.zip',       img:'ok_networks.png' },
  { id:'okbank_id',      name:'OKBANK 인도네시아',        tags:['okbank인도네시아','okbank indonesia','인도네시아'],        zip:'okbank_indonesia_ai.zip', img:'ok_bank_id.png' },
  { id:'okbigyo',        name:'OK비교대출',               tags:['ok비교대출','okbigyo','비교대출'],                        zip:'okbigyo_ai.zip',          img:'ok_bigyo.png' },
  { id:'okpay',          name:'OKPay',                  tags:['okpay','ok페이','페이'],                               zip:'okpay_ai.zip',            img:'ok_pay.png' },
  { id:'okschool',       name:'OK배·정장학재단',           tags:['ok장학재단','okschool','장학재단','배정장학'],              zip:'okschool_ai.zip',         img:'ok_school.png' },
  { id:'oksports',       name:'OK저축은행 읏맨 프로배구단', tags:['읏맨','배구단','oksports','프로배구'],                     zip:'oksports_ai.zip',         img:'ok_sports.png' },
  { id:'oksports_rugby', name:'OK저축은행 읏맨 럭비단',    tags:['럭비단','oksports_rugby','럭비'],                       zip:'oksports_rugby_ai.zip',   img:'ok_sports_rugby.png' },
];

let currentBrand = null;

function renderGrid(filter = '') {
  const grid = document.getElementById('grid');
  const q = filter.toLowerCase().trim();
  const filtered = q
    ? BRANDS.filter(b => b.name.toLowerCase().includes(q) || b.tags.some(t => t.toLowerCase().includes(q)))
    : BRANDS;

  const countEl = document.getElementById('countLabel');
  countEl.textContent =
    filtered.length === BRANDS.length ? `${BRANDS.length}개 브랜드` : `${filtered.length} / ${BRANDS.length}개`;
  countEl.classList.remove('flash');
  requestAnimationFrame(() => countEl.classList.add('flash'));

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }

  grid.innerHTML = filtered.map((b, i) => `
    <div class="card" data-id="${b.id}" style="animation-delay:${Math.min(i * 0.045, 0.4)}s" onclick="openModal('${b.id}')">
      <div class="card-thumb">
        <img src="${IMG_BASE}${b.img}" alt="${b.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="no-img" style="display:none">미리보기 없음</span>
      </div>
      <div class="card-info">
        <div class="card-name">${b.name}</div>
        <button class="card-dl" onclick="event.stopPropagation();downloadBrand('${b.id}',this)">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M12 3v13M5 14l7 7 7-7"/>
          </svg>
          ZIP 다운로드
        </button>
      </div>
    </div>
  `).join('');
}

function triggerDownload(url, filename) {
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function downloadBrand(id, btn) {
  const b = BRANDS.find(x => x.id === id);
  if (!b) return;
  triggerDownload(ZIP_BASE + b.zip, b.zip);
  if (btn) {
    btn.disabled = true; btn.classList.add('done');
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 완료';
    setTimeout(() => {
      btn.disabled = false; btn.classList.remove('done');
      btn.innerHTML = '<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 3v13M5 14l7 7 7-7"/></svg> ZIP 다운로드';
    }, 2000);
  }
  showToast(`✓ ${b.name} 다운로드 시작`);
}

function downloadAll() {
  const btn = document.getElementById('dlAllBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 다운로드 중…';
  triggerDownload(ZIP_BASE + ALL_ZIP, ALL_ZIP);
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 다운로드 완료';
  btn.classList.add('done');
  showToast('✓ 전체 로고 ZIP 다운로드 시작');
  setTimeout(() => {
    btn.disabled = false; btn.classList.remove('done');
    btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 3v13M5 14l7 7 7-7"/><path d="M3 21h18"/></svg> 전체 다운로드 (16개)';
  }, 3000);
}

function openModal(id) {
  const b = BRANDS.find(x => x.id === id);
  if (!b) return;
  currentBrand = b;
  document.getElementById('modalName').textContent = b.name;
  document.getElementById('modalImg').src = IMG_BASE + b.img;
  document.getElementById('modalInfo').innerHTML =
    `<span>ZIP 파일명</span> ${b.zip}<br><span>포함 내용</span> AI 원본 (CMYK) + PNG × RGB/CMYK 세트`;
  const dlBtn = document.getElementById('modalDlBtn');
  dlBtn.disabled = false;
  dlBtn.innerHTML = '<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 3v13M5 14l7 7 7-7"/><path d="M3 21h18"/></svg> ZIP 다운로드';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  currentBrand = null;
}

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', () => {
  searchClear.classList.toggle('show', searchInput.value.length > 0);
  renderGrid(searchInput.value);
});
searchClear.onclick = () => { searchInput.value=''; searchClear.classList.remove('show'); renderGrid(''); searchInput.focus(); };

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBg').onclick = e => { if (e.target===e.currentTarget) closeModal(); };
document.getElementById('dlAllBtn').onclick = downloadAll;
document.getElementById('modalDlBtn').onclick = () => {
  if (!currentBrand) return;
  const btn = document.getElementById('modalDlBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 다운로드 중…';
  downloadBrand(currentBrand.id, null);
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> 완료';
  setTimeout(closeModal, 700);
};
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeModal();
  if (e.key==='/' && document.activeElement!==searchInput) { e.preventDefault(); searchInput.focus(); }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── 위로가기 ─────────────────────────────────────
const toTopBtn = document.getElementById('toTopBtn');
function onScroll() {
  const doc = document.documentElement;
  const scrollTop = doc.scrollTop || document.body.scrollTop;
  toTopBtn.classList.toggle('show', scrollTop > 320);
}
document.addEventListener('scroll', onScroll, { passive: true });
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
onScroll();

renderGrid();
</script>
</body>
</html>
