/* OKFont Web */
@font-face{font-family:'OKFont';src:url('font/okfont_web/오케이체 Light.eot');src:url('font/okfont_web/오케이체 Light.eot?#iefix') format('embedded-opentype'),url('font/okfont_web/오케이체 Light.woff2') format('woff2'),url('font/okfont_web/오케이체 Light.woff') format('woff');font-weight:300;font-style:normal}
@font-face{font-family:'OKFont';src:url('font/okfont_web/오케이체 Medium.eot');src:url('font/okfont_web/오케이체 Medium.eot?#iefix') format('embedded-opentype'),url('font/okfont_web/오케이체 Medium.woff2') format('woff2'),url('font/okfont_web/오케이체 Medium.woff') format('woff');font-weight:500;font-style:normal}
@font-face{font-family:'OKFont';src:url('font/okfont_web/오케이체 Bold.eot');src:url('font/okfont_web/오케이체 Bold.eot?#iefix') format('embedded-opentype'),url('font/okfont_web/오케이체 Bold.woff2') format('woff2'),url('font/okfont_web/오케이체 Bold.woff') format('woff');font-weight:700;font-style:normal}
/* ── OK저축은행 Design Tokens ──
   BG/White       : #ffffff   Ink/100 header bg   : #f7f7f9
   Ink/200 surface: #f1f3f5   Ink/250 border      : #e9ebf0
   Ink/450 muted  : #8c94a2   Ink/500 sub         : #6c7080
   Ink/600 detail : #4d5764   Ink/800 body        : #161c26
   Point/Normal   : #ff571f   BG/Orange/100 hover : #fff2ee
   BTN/radius     : 16px      radius/sm           : 8px
──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',Inter,sans-serif;background:#ffffff;color:#161c26;min-height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
/* Header — Header/Main/bg = Ink/100 */
#header{background:#f7f7f9;border-bottom:1px solid #e9ebf0;padding:0 24px;display:flex;align-items:center;gap:14px;height:60px;flex-shrink:0}
.home-btn{display:flex;align-items:center;gap:5px;padding:8px 16px;border:1px solid #e9ebf0;background:#f1f3f5;cursor:pointer;font-size:13px;font-weight:500;font-family:'Pretendard',Inter,sans-serif;color:#161c26;border-radius:16px;text-decoration:none;transition:background .15s,color .15s;white-space:nowrap;}
.home-btn:hover{background:#e9ebf0;color:#161c26;}
#header h1{font-size:14px;font-weight:600;color:#161c26;white-space:nowrap;letter-spacing:-0.016em;flex:1;}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{padding:8px 20px;border-radius:16px;cursor:pointer;font-family:'Pretendard',Inter,sans-serif;font-size:13px;font-weight:600;transition:background .15s,border-color .15s;letter-spacing:-0.01em}
.export-btn{background:#ff571f;color:#ffffff;border:1px solid #ff571f;}
.export-btn:hover{background:#e64813;border-color:#e64813;}
/* Main */
#main{display:flex;flex:1;overflow:hidden}
/* Canvas area */
#canvas-area{flex:1;display:flex;flex-direction:column;align-items:stretch;background:#f1f3f5;overflow:auto;}
/* Tab strip above canvas */
#tpl-tabs-strip{background:#ffffff;border-bottom:1px solid #e9ebf0;display:flex;padding:0 16px;flex-shrink:0;}
.tpl-tabs{display:flex;}
.tab-btn{padding:12px 16px;border:none;background:transparent;cursor:pointer;font-size:14px;font-family:'Pretendard',Inter,sans-serif;color:#161c26;font-weight:500;letter-spacing:-0.01em;transition:box-shadow .15s;white-space:nowrap;}
.tab-btn:hover{box-shadow:#e9ebf0 0px -2px 0px 0px inset;}
.tab-btn.active{box-shadow:rgb(255,87,31) 0px -2px 0px 0px inset;font-weight:600;color:#ff571f;}
/* Device tabs — MO/PC toggle */
.device-tabs{display:flex;gap:6px;padding:14px 18px;background:#ffffff;border-bottom:1px solid #e9ebf0;flex-shrink:0;}
.dev-btn{flex:1;padding:9px 0;border:1px solid #e9ebf0;background:#f1f3f5;border-radius:16px;font-family:'Pretendard',Inter,sans-serif;font-size:13px;font-weight:500;color:#161c26;cursor:pointer;transition:all .15s;}
.dev-btn.active{background:#161c26;border-color:#161c26;color:#ffffff;font-weight:600;}
.dev-btn:disabled{opacity:.35;cursor:not-allowed}
#canvas-area-inner{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
#canvas-wrapper{box-shadow:0 4px 24px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);border-radius:4px}
#canvas{width:360px;height:480px;position:relative;overflow:visible;transition:opacity .2s ease,width .28s ease,height .28s ease;flex-shrink:0}
/* Panel */
#panel-wrapper{width:340px;flex-shrink:0;}
#panel{background:#ffffff;overflow-y:auto;}
.panel-sec{padding:20px;border-bottom:1px solid #e9ebf0;}
.panel-sec h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#8c94a2;margin-bottom:12px;font-family:'Pretendard',Inter,sans-serif}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:#6c7080;margin-bottom:5px;font-weight:500;letter-spacing:-0.01em;font-family:'Pretendard',Inter,sans-serif}
.fg input,.fg textarea{width:100%;border:1px solid #e9ebf0;border-radius:8px;padding:10px 12px;font-family:'Pretendard',Inter,sans-serif;font-size:14px;color:#161c26;resize:vertical;line-height:1.4;background:#ffffff;transition:border-color .2s,box-shadow .2s;outline:none;}
.fg input::placeholder,.fg textarea::placeholder{color:#8c94a2;}
.fg input:focus,.fg textarea:focus{border-color:#ff571f;box-shadow:0 0 0 3px rgba(255,87,31,.08);}
/* Toggle */
.tog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tog-row span{font-size:13px;color:#161c26;letter-spacing:-0.01em;font-family:'Pretendard',Inter,sans-serif}
.tog{position:relative;width:44px;height:26px}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:#d3d8e4;border-radius:26px;cursor:pointer;transition:background .25s;}
.tog-sl::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog input:checked+.tog-sl{background:#ff571f}
.tog input:checked+.tog-sl::before{transform:translateX(18px)}
/* Image upload */
.img-drop{border:1.5px dashed #e9ebf0;border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#f1f3f5;transition:all .2s}
.img-drop:hover{border-color:#ff571f;background:#fff2ee}
.img-drop span{font-size:13px;color:#8c94a2;display:block;margin-top:4px;font-family:'Pretendard',Inter,sans-serif}
/* 이미지 슬롯 선택 상태 */
@keyframes slot-pulse {
  0%,100%{box-shadow:0 0 0 0 rgba(255,87,31,.5),0 0 0 3px rgba(255,87,31,.25);}
  50%{box-shadow:0 0 0 5px rgba(255,87,31,.15),0 0 0 3px rgba(255,87,31,.4);}
}
.slot-active{outline:2.5px solid #ff571f !important;outline-offset:2px;animation:slot-pulse 1.2s ease-in-out infinite;position:relative;z-index:10;}
.slot-active::after{content:'이미지를 선택하세요';position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#ff571f;color:#fff;font-size:11px;font-family:'Pretendard',Inter,sans-serif;font-weight:600;white-space:nowrap;padding:4px 10px;border-radius:8px;pointer-events:none;z-index:100;}
.img-drop.slot-active{border-color:#ff571f;background:#fff2ee;}
.img-preview{width:100%;max-height:140px;object-fit:contain;border-radius:8px;margin-bottom:8px}
.rm-btn{width:100%;padding:7px;border:1px solid #ff571f;border-radius:16px;color:#ff571f;background:transparent;cursor:pointer;font-family:'Pretendard',Inter,sans-serif;font-size:12px;font-weight:500;margin-top:6px;transition:all .2s}
.rm-btn:hover{background:#fff2ee}
/* Canvas common */
.c-logo{position:absolute;right:12px;top:6px;z-index:20;pointer-events:none}
.c-review{color:#545964;font-family:'Pretendard',sans-serif;font-size:9px;position:absolute}
.cta-wrap{position:absolute;left:24px;width:312px;height:56px;background:#FF571F;border-radius:12px;box-shadow:2px 4px 10px rgba(92,75,77,.2);display:flex;align-items:center;justify-content:center}
.cta-inner{font-family:'Pretendard',sans-serif;font-size:20px;font-weight:600;color:#fff;outline:none;min-width:40px;text-align:center}
[contenteditable]{outline:none;border-radius:2px}
[contenteditable]:hover{box-shadow:0 0 0 1.5px rgba(255,87,31,.35)}
[contenteditable]:focus{box-shadow:0 0 0 2px #FF571F;background:rgba(255,255,255,.5)}
.cta-inner:hover,.cta-inner:focus{box-shadow:none;background:transparent}
.hidden{display:none!important}
/* Overlay Images */
.ov-wrap{position:absolute;box-sizing:border-box;z-index:100;cursor:move;touch-action:none;transform-origin:center center}
.ov-img-el{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;user-select:none}
.ov-border{position:absolute;inset:-2px;border:2px dashed transparent;pointer-events:none;border-radius:2px}
.ov-selected .ov-border{border-color:#FF571F}
.ov-controls{position:absolute;top:-34px;left:50%;transform:translateX(-50%);display:none;background:#161c26;border-radius:8px;padding:3px 5px;gap:3px;white-space:nowrap;align-items:center;z-index:10}
.ov-selected .ov-controls{display:flex}
.ov-ctrl-btn{background:transparent;border:none;color:#ffffff;cursor:pointer;font-size:11px;padding:3px 7px;border-radius:4px;font-family:'Pretendard',Inter,sans-serif;white-space:nowrap}
.ov-ctrl-btn:hover{background:rgba(255,255,255,.15)}
.ov-ctrl-sep{width:1px;height:14px;background:rgba(255,255,255,.2);flex-shrink:0}
.ov-resize{position:absolute;bottom:-5px;right:-5px;width:12px;height:12px;background:#FF571F;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;display:none;z-index:11}
.ov-selected .ov-resize{display:block}
.ov-rot-stem{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:2px;height:14px;background:#FF571F;display:none;pointer-events:none}
.ov-rot-handle{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:#FF571F;border:2px solid #fff;border-radius:50%;cursor:crosshair;display:none;z-index:11}
.ov-selected .ov-rot-stem,.ov-selected .ov-rot-handle{display:block}
/* Image Library Sidebar */
#main{position:relative}
#lib-panel{width:280px;min-width:280px;background:#ffffff;border-right:1px solid #e9ebf0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
#lib-ph{padding:16px 18px;border-bottom:1px solid #e9ebf0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#f7f7f9;}
#lib-ph span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#8c94a2;font-family:'Pretendard',Inter,sans-serif}
#lib-ph button{display:none;}
#lib-body{display:flex;flex:1;overflow:hidden;min-height:0}
#lib-cats{width:108px;border-right:1px solid #e9ebf0;overflow-y:auto;padding:6px 0;flex-shrink:0;background:#f7f7f9;}
.lib-cat{padding:10px 14px;font-size:13px;color:#4d5764;cursor:pointer;border-left:2px solid transparent;transition:all .2s;line-height:1.3;word-break:keep-all;font-family:'Pretendard',Inter,sans-serif;letter-spacing:-0.01em}
.lib-cat.active{color:#ff571f;font-weight:600;border-left-color:#ff571f;background:#fff2ee}
.lib-cat:hover:not(.active){background:#f1f3f5}
#lib-right{flex:1;overflow-y:auto;padding:10px;background:#ffffff;}
.lib-subcat-btn{width:100%;text-align:left;background:none;border:none;padding:8px 6px;font-size:12px;font-weight:600;color:#8c94a2;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;font-family:'Pretendard',Inter,sans-serif;display:flex;align-items:center;gap:4px;border-radius:4px;transition:color .2s}
.lib-subcat-btn::before{content:'▶';font-size:9px;transition:transform .2s}
.lib-subcat-btn.open::before{transform:rotate(90deg)}
.lib-subcat-btn:hover{color:#ff571f}
.lib-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 0 10px}
.lib-imgs.collapsed{display:none}
.lib-img-item{aspect-ratio:1;cursor:pointer;border-radius:8px;overflow:hidden;border:2px solid transparent;transition:all .2s;background:#f1f3f5;padding:4px;display:flex;align-items:center;justify-content:center}
.lib-img-item img{width:100%;height:100%;object-fit:contain}
.lib-img-item:hover{border-color:#ff571f;background:#fff2ee}
.lib-img-item.applying{opacity:.5;pointer-events:none}

/* T0 Popup_Product */
#tpl-0{background:#ffffff;width:360px;height:480px;position:relative;overflow:hidden}
.t0-sub{position:absolute;top:40px;left:20px;width:320px;font-family:'Pretendard',sans-serif;font-size:14px;font-weight:500;color:#161c26;text-align:center;line-height:16px}
.t0-ttl{position:absolute;top:63px;left:20px;width:320px;font-family:'OKFont','Pretendard',sans-serif;font-size:40px;font-weight:700;color:#161c26;letter-spacing:-1.6px;text-align:center;white-space:pre-wrap;line-height:1.1}
.t0-body{position:absolute;top:118px;left:20px;width:320px;font-family:'Pretendard',sans-serif;font-size:20px;font-weight:500;color:#161c26;text-align:center;line-height:1.4}
.t0-rate{position:absolute;top:150px;left:20px;width:320px;font-family:'Pretendard',sans-serif;font-size:20px;font-weight:600;color:#161c26;text-align:center;line-height:29px;transition:opacity .2s}
.t0-cond{position:absolute;top:179px;left:20px;width:320px;font-family:'Pretendard',sans-serif;font-size:12.162px;font-weight:500;color:rgba(22,28,38,0.6);letter-spacing:-0.2432px;text-align:center;line-height:24.324px;transition:opacity .2s}
.t0-img{position:absolute;left:50%;transform:translateX(-50%);width:200px;height:200px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:top .2s}
.t0-img img{width:100%;height:100%;object-fit:cover}
.t0-img-ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:#bbb;font-family:'Pretendard',sans-serif;font-size:11px;width:100%;height:100%;justify-content:center;border:2px dashed #ddd;border-radius:8px}
.t0-cta{top:392px}
.t0-rev{top:458px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#6c7080;letter-spacing:-0.18px}

/* T1 Popup_PolicyChange */
#tpl-1{background:#FFF2EE;width:360px;height:480px;position:relative;display:flex;flex-direction:column;padding:8px 12px 12px;overflow:hidden}
.t1-wrap{display:flex;flex-direction:column;gap:10px;width:100%;flex:1;min-height:0;padding:36px 0 12px;align-items:center}
.t1-title-row{display:flex;align-items:center;justify-content:center;width:100%;padding-top:8px;flex-shrink:0}
.t1-title-text{font-family:'OKFont','Pretendard',sans-serif;font-size:24px;font-weight:500;color:#161c26;letter-spacing:-0.96px;line-height:32px;text-align:center;white-space:nowrap}
.hl{color:#ff571f;font-weight:500}
.t1-card{border:1px solid #FFD0C1;border-radius:12px;overflow:hidden;width:100%;flex-shrink:0}
.t1-card-grow{border:1px solid #FFD0C1;border-radius:12px;overflow:hidden;width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
.t1-ch{background:#FFD0C1;height:22px;display:flex;align-items:center;justify-content:center;font-family:'Pretendard',sans-serif;font-size:14px;font-weight:500;color:#545964;line-height:20px;white-space:nowrap;flex-shrink:0}
.t1-cb{background:#fff;padding:12px 0;display:flex;align-items:center;justify-content:center;width:100%}
.t1-cb-grow{background:#fff;padding:12px 0;display:flex;align-items:flex-start;justify-content:center;width:100%;flex:1;min-height:0;overflow-y:auto}
.t1-cb-inner{font-family:'Pretendard',sans-serif;font-size:16px;font-weight:500;color:#161c26;letter-spacing:-0.32px;line-height:24px;text-align:center;white-space:pre-wrap}
.t1-note{width:304px;font-family:'Pretendard',sans-serif;font-size:10px;font-weight:400;color:#545964;letter-spacing:-0.2px;line-height:14px;text-align:center;white-space:pre-wrap;flex-shrink:0}

/* T2 Popup_InterestGuide */
#tpl-2{background:linear-gradient(180deg,#FFFAF9 0%,#FFF1ED 100%);width:360px;height:480px;position:relative;overflow:hidden}
.t2-hdg{position:absolute;left:50%;top:83px;transform:translate(-50%,-50%);font-family:'OKFont','Pretendard',sans-serif;font-size:34px;font-weight:500;color:#161c26;letter-spacing:-1.36px;text-align:center;line-height:1.2;max-width:500px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t2-card{position:absolute;left:28px;top:133px;width:304px;height:203px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center}
.t2-details{display:flex;flex-direction:column;gap:12px;align-items:center}
.t2-terms{display:flex;flex-direction:column;gap:6px;align-items:center;white-space:nowrap}
.t2-row{display:flex;align-items:baseline;gap:2px;font-family:'OKFont','Pretendard',sans-serif}
.t2-hi{color:#FF571F;font-size:27px;font-weight:500;letter-spacing:-1.08px}
.t2-sf{font-size:19px;color:#545964;font-weight:500;letter-spacing:-0.76px;flex-shrink:0}
.t2-prod{font-family:'OKFont','Pretendard',sans-serif;font-size:22px;font-weight:500;color:#161c26;width:279px;text-align:center;letter-spacing:-0.88px}
.t2-cta{top:392px}
.t2-rev{position:absolute;top:458px;left:50%;transform:translateX(-50%);width:312px;text-align:center;font-family:'Pretendard',sans-serif;font-size:9px;font-weight:400;color:#545964;letter-spacing:-0.18px;white-space:nowrap}

/* T3 Popup_General */
#tpl-3{background:#fff;width:360px;height:480px;position:relative;overflow:hidden}
.t3-circle{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;background:#FFEEE1}
.t3-img-slot{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}

.t3-hdg{font-family:'OKFont','Pretendard',sans-serif;font-size:28px;font-weight:500;color:#161c26;letter-spacing:-0.56px;text-align:center;white-space:normal;line-height:36px}
.t3-body-wrap{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;width:100%}
.t3-body-p{font-family:'Pretendard',sans-serif;font-size:16px;font-weight:400;color:#161c26;line-height:24px;text-align:center;white-space:pre-wrap}
.t3-hl{color:#ff571f;font-weight:600}
.t3-card{position:absolute;left:29px;width:303px;background:#f7f7f9;border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.t3-cta{top:378px}
.t3-note{font-family:'Pretendard',sans-serif;font-size:10px;font-weight:400;color:#545964;text-align:center;line-height:13px;white-space:nowrap}
.t3-rev{bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;transition:opacity .2s}

/* MO/PC toggle — styles defined above in UI chrome section */

/* T1 PC */
#tpl-1.pc{width:520px;height:auto;min-height:580px;padding:10px 16px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;overflow:hidden}
.c-logo.pc-logo{right:auto;left:20px;top:16px}
.t1pc-hdg{font-family:'OKFont','Pretendard',sans-serif;font-size:30px;font-weight:500;color:#161c26;letter-spacing:-1.2px;line-height:40px;padding-top:46px;width:100%;text-align:center}
.t1pc-card{border:1.25px solid #ffd0c1;border-radius:16px;overflow:hidden;width:100%;flex-shrink:0}
.t1pc-ch{background:#ffd0c1;height:27px;display:flex;align-items:center;justify-content:center;font-family:'Pretendard',sans-serif;font-size:17px;font-weight:500;color:#545964;line-height:24.5px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:#161c26;color:#fff;border-radius:12px;font-size:13px;font-family:'Pretendard',Inter,sans-serif;z-index:99999;opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.18);}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:#cc0000;}
/* ── STATUS BADGE ── */
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Pretendard',Inter,sans-serif;border:none;transition:opacity .15s;white-space:nowrap;flex-shrink:0;}
.status-badge:hover{opacity:0.82;}
/* ── STATUS DROPDOWN ── */
.status-dropdown{position:fixed;z-index:99998;background:#fff;border:1px solid #e9ebf0;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.14);padding:6px;min-width:180px;}
.status-opt{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'Pretendard',Inter,sans-serif;color:#161c26;transition:background .1s;}
.status-opt:hover{background:#f1f3f5;}
.status-opt.s-active{background:#f1f3f5;font-weight:600;}
.status-opt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(22,28,38,.52);z-index:99990;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border-radius:20px;width:420px;max-width:100%;box-shadow:0 24px 64px rgba(0,0,0,.2);display:flex;flex-direction:column;max-height:85vh;}
.modal-header{padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-size:16px;font-weight:700;color:#161c26;letter-spacing:-0.03em;font-family:'Pretendard',Inter,sans-serif;}
.modal-close{width:32px;height:32px;border:none;background:#f1f3f5;border-radius:50%;cursor:pointer;font-size:15px;color:#6c7080;display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1;}
.modal-close:hover{background:#e9ebf0;}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1;}
.modal-footer{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
.modal-lbl{font-size:11px;font-weight:600;color:#8c94a2;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'Pretendard',Inter,sans-serif;display:block;}
.modal-input{width:100%;padding:10px 14px;border:1px solid #e9ebf0;border-radius:8px;font-size:14px;font-family:'Pretendard',Inter,sans-serif;color:#161c26;outline:none;transition:border-color .15s;background:#fff;}
.modal-input:focus{border-color:#ff571f;}
.modal-sep{height:1px;background:#e9ebf0;margin:18px 0;}
/* ── STATUS RADIO ── */
.sradio-grid{display:flex;flex-direction:column;gap:6px;}
.sradio-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid #e9ebf0;cursor:pointer;transition:all .15s;}
.sradio-opt.sel{border-color:#ff571f;background:#fff2ee;}
.sradio-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sradio-lbl{font-size:13px;font-family:'Pretendard',Inter,sans-serif;color:#161c26;}
/* ── DRAFT LIST ── */
.draft-item{padding:14px;border:1px solid #e9ebf0;border-radius:12px;margin-bottom:8px;transition:all .15s;}
.draft-item:hover{border-color:#b2b7c0;background:#f7f7f9;}
.draft-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.draft-name{font-size:14px;font-weight:600;color:#161c26;font-family:'Pretendard',Inter,sans-serif;}
.draft-time{font-size:11px;color:#8c94a2;font-family:'Pretendard',Inter,sans-serif;flex-shrink:0;}
.draft-row2{display:flex;align-items:center;justify-content:space-between;}
.draft-actions{display:flex;gap:6px;}
.d-btn{padding:5px 10px;border-radius:8px;font-size:12px;font-family:'Pretendard',Inter,sans-serif;cursor:pointer;border:none;font-weight:500;transition:all .15s;}
.d-load{background:#ff571f;color:#fff;}.d-load:hover{background:#e64813;}
.d-del{background:#f1f3f5;color:#6c7080;}.d-del:hover{background:#e9ebf0;}
.d-hist{background:#f1f3f5;color:#6c7080;}.d-hist:hover{background:#e9ebf0;}
/* ── HISTORY ── */
.hist-panel{margin-top:10px;padding:12px;background:#f7f7f9;border-radius:8px;display:none;}
.hist-panel.open{display:block;}
.hist-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #e9ebf0;}
.hist-item:last-child{border-bottom:none;}
.hist-time{font-size:11px;color:#8c94a2;white-space:nowrap;font-family:'Pretendard',Inter,sans-serif;margin-top:1px;flex-shrink:0;}
.hist-text{font-size:12px;color:#161c26;font-family:'Pretendard',Inter,sans-serif;}
/* ── MODAL BTNS ── */
.btn-ok{padding:10px 22px;background:#ff571f;color:#fff;border:none;border-radius:16px;font-size:14px;font-weight:600;font-family:'Pretendard',Inter,sans-serif;cursor:pointer;transition:background .15s;}
.btn-ok:hover{background:#e64813;}
.btn-ok:disabled{opacity:.5;cursor:not-allowed;}
.btn-cancel{padding:10px 20px;background:#f1f3f5;color:#161c26;border:none;border-radius:16px;font-size:14px;font-weight:500;font-family:'Pretendard',Inter,sans-serif;cursor:pointer;transition:background .15s;}
.btn-cancel:hover{background:#e9ebf0;}
/* ── HDR SECONDARY ── */
.hdr-btn-sec{padding:8px 16px;border-radius:16px;border:1px solid #e9ebf0;background:#f1f3f5;color:#161c26;font-size:13px;font-family:'Pretendard',Inter,sans-serif;cursor:pointer;font-weight:500;transition:background .15s;}
.hdr-btn-sec:hover{background:#e9ebf0;}
/* ── RESTORE BAR ── */
.restore-bar{position:fixed;bottom:0;left:0;right:0;background:#161c26;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:99997;font-family:'Pretendard',Inter,sans-serif;font-size:13px;}
.restore-bar-btns{display:flex;gap:8px;}
.rb-yes{padding:6px 14px;background:#ff571f;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;font-family:'Pretendard',Inter,sans-serif;}
.rb-no{padding:6px 14px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:12px;font-family:'Pretendard',Inter,sans-serif;}
</style>

const PASTEL_COLORS = [
  { name: '화이트', value: '#FFFFFF' },
  { name: '피치', value: '#FFF7F5' },
  { name: '레몬', value: '#FDFEE8' },

  { name: '라벤더', value: '#F8F3FD' },

];

// ============================================================
// HELPERS
// ============================================================
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function editable(cls, field, text, multiline, allowEnter) {
  const e = el('div', cls);
  e.contentEditable = 'true';
  e.dataset.field = field;
  if (HTML_FIELDS.includes(field)) {
    e.innerHTML = text;
  } else {
    e.textContent = text;
  }
  if (multiline) e.style.whiteSpace = 'pre-wrap';
  e.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      if (allowEnter) {
        // 엔터로 줄바꿈 허용 — <br> 삽입
        ev.preventDefault();
        document.execCommand('insertLineBreak');
        syncCanvasToPanel(field, e.innerHTML);
      } else if (!multiline || !ev.shiftKey) {
        ev.preventDefault(); e.blur();
      }
    }
  });
  e.addEventListener('input', () => syncCanvasToPanel(field, HTML_FIELDS.includes(field) ? e.innerHTML : e.textContent));
  return e;
}

function applyTextColor(color, elementId, field) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const sel = window.getSelection();
  if (!sel || sel.toString().length === 0) return;
  try {
    const range = sel.getRangeAt(0);

    if (color === '#ff571f') {
      // 강조색: 추출 → .hl span으로 래핑 → 재삽입
      const fragment = range.extractContents();
      const tmp = document.createElement('div');
      tmp.appendChild(fragment);
      // 기존 .hl 중첩 제거
      tmp.querySelectorAll('span.hl').forEach(s => {
        while (s.firstChild) s.parentNode.insertBefore(s.firstChild, s);
        s.parentNode.removeChild(s);
      });
      const span = document.createElement('span');
      span.className = 'hl';
      while (tmp.firstChild) span.appendChild(tmp.firstChild);
      range.insertNode(span);
    } else {
      // 기본색: range 조작 없이 innerHTML에서 .hl span만 언래핑
      const tmp = document.createElement('div');
      tmp.innerHTML = el.innerHTML;
      tmp.querySelectorAll('span.hl').forEach(s => {
        const frag = document.createDocumentFragment();
        while (s.firstChild) frag.appendChild(s.firstChild);
        s.parentNode.replaceChild(frag, s);
      });
      el.innerHTML = tmp.innerHTML;
    }

    sel.removeAllRanges();
    S.tpls[S.cur].f[field] = el.innerHTML;
    renderAll();
  } catch (e) {
    console.error('applyTextColor failed:', e);
  }
}

function logo() {
  const d = el('div', 'c-logo');
  d.innerHTML = LOGO_SVG;
  return d;
}

function ctaBtn(text, extraCls) {
  const wrap = el('div', 'cta-wrap ' + extraCls);
  const inner = el('div', 'cta-inner');
  inner.contentEditable = 'true';
  inner.dataset.field = 'cta';
  inner.textContent = text;
  inner.addEventListener('keydown', ev => { if(ev.key==='Enter'){ev.preventDefault();inner.blur();} });
  inner.addEventListener('input', () => syncCanvasToPanel('cta', inner.textContent));
  wrap.appendChild(inner);
  return wrap;
}

function review(text, extraCls) {
  const d = editable('c-review ' + extraCls, 'review', text, false);
  return d;
}

// ============================================================
// TEMPLATE RENDERERS
// ============================================================
function renderT0(t) {
  const root = el('div'); root.id = 'tpl-0';
  if (t.bgcolor) root.style.background = t.bgcolor;
  root.appendChild(logo());
  root.appendChild(editable('t0-sub', 'subtitle', t.f.subtitle, false));
  root.appendChild(editable('t0-ttl', 'title', t.f.title, true));
  root.appendChild(editable('t0-body', 'body', t.f.body, false));

  const rateEl = editable('t0-rate', 'rate', t.f.rate, false);
  const condEl = editable('t0-cond', 'condition', t.f.condition, false);
  if (!t.showRate) { rateEl.classList.add('hidden'); condEl.classList.add('hidden'); }
  root.appendChild(rateEl);
  root.appendChild(condEl);

  const imgSlot = el('div', 't0-img');
  imgSlot.id = 'canvasImgSlot';
  imgSlot.style.top = (t.showRate ? 200 : 168) + 'px';
  if (t.image) {
    const img = el('img'); img.src = encodePath(t.image);
    imgSlot.appendChild(img);
  } else {
    const ph = el('div', 't0-img-ph');
    ph.innerHTML = '<span style="font-size:26px">🖼</span><span>클릭하여 이미지 업로드</span>';
    imgSlot.appendChild(ph);
  }
  imgSlot.addEventListener('click', e => openLibForSlot(0, e.currentTarget));
  root.appendChild(imgSlot);

  root.appendChild(ctaBtn(t.f.cta, 't0-cta'));
  root.appendChild(review(t.f.review, 't0-rev'));
  return root;
}

function adjustT0Layout() {
  if (S.cur !== 0) return;
  const canvas = document.getElementById('canvas');
  if (!canvas) return;
  const bodyEl  = canvas.querySelector('.t0-body');
  const rateEl  = canvas.querySelector('.t0-rate');
  const condEl  = canvas.querySelector('.t0-cond');
  const imgEl   = canvas.querySelector('.t0-img');
  if (!bodyEl) return;

  const BODY_TOP = 118;
  const GAP = 4;
  let cursor = BODY_TOP + bodyEl.offsetHeight + GAP;

  if (rateEl && !rateEl.classList.contains('hidden')) {
    rateEl.style.top = cursor + 'px';
    cursor += rateEl.offsetHeight;
  }
  if (condEl && !condEl.classList.contains('hidden')) {
    condEl.style.top = cursor + 'px';
    cursor += condEl.offsetHeight + GAP;
  }
  if (imgEl) {
    imgEl.style.top = cursor + 'px';
  }
}

// ============================================================
// HTML 필드 목록 (줄바꿈·하이라이트 지원)  ← fg()보다 먼저 선언
const HTML_FIELDS = ['subtitle','title','body','heading','body1','body2','period','rate','condition','product','products','changes'];

// innerHTML → 사람이 읽을 수 있는 텍스트 (패널 표시용)
function htmlToText(html) {
  return (html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}
// 패널 텍스트 → innerHTML (캔버스 저장용)
function textToHtml(text) {
  return (text || '').replace(/\n/g, '<br>');
}

// PANEL RENDERERS
// ============================================================
function fg(label, field, value, rows) {
  const d = el('div', 'fg');
  d.appendChild(el('label', null, label));
  let inp;
  if (rows) {
    inp = el('textarea'); inp.rows = rows;
  } else {
    inp = el('input'); inp.type = 'text';
  }
  // HTML 필드는 <br>→\n, <span>→텍스트 변환해서 패널에 표시
  const textValue = (typeof value === 'string' && HTML_FIELDS.includes(field))
    ? htmlToText(value)
    : (value || '');
  inp.value = textValue; inp.dataset.field = field; inp.className = 'pinp';
  inp.addEventListener('input', () => {
    // 패널 텍스트를 HTML로 변환해서 캔버스·상태에 동기화
    syncPanelToCanvas(field, inp.value);
  });
  d.appendChild(inp);
  return d;
}

}

let aiLoading = false;

async function callAI(userMsg) {
  if (aiLoading || !userMsg.trim()) return;
  aiLoading = true;
  const statusEl = document.getElementById('ai-status');
  if (statusEl) { statusEl.textContent = '⏳ AI 생성 중...'; statusEl.style.color = '#999'; }

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ template: S.cur, message: userMsg })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // 필드 적용
    const fields = data.fields;
    for (const [field, value] of Object.entries(fields)) {
      if (S.tpls[S.cur].f.hasOwnProperty(field)) {
        S.tpls[S.cur].f[field] = value;
      }
    }

    // 이미지 오버레이 배치 (2개, 대각선 구도, 크기 편차, 랜덤 각도)
    if (data.imagePaths && data.imagePaths.length > 0) {
      if (!S.tpls[S.cur].overlayImgs) S.tpls[S.cur].overlayImgs = [];
      const paths = data.imagePaths.slice(0, 2);

      // 대각선 구도 랜덤 선택: 좌상+우하 또는 우상+좌하
      const diagonal = Math.random() < 0.5 ? 'LTRB' : 'RTLB';
      const zones = diagonal === 'LTRB'
        ? [{ x: 10 + Math.random() * 40, y: 50 + Math.random() * 40 },    // 좌상
           { x: 220 + Math.random() * 40, y: 320 + Math.random() * 50 }]  // 우하
        : [{ x: 220 + Math.random() * 40, y: 50 + Math.random() * 40 },   // 우상
           { x: 10 + Math.random() * 40, y: 320 + Math.random() * 50 }];  // 좌하

      // 크기 편차: 큰것 + 작은것
      const sizes = [{ w: 120, h: 120 }, { w: 80, h: 80 }];

      paths.forEach((path, i) => {
        const pos = zones[i];
        const sz = sizes[i];
        const rotation = Math.round((Math.random() * 30 - 15) * 10) / 10;
        S.tpls[S.cur].overlayImgs.push({
          id: Date.now() + Math.random(),
          src: path,
          x: Math.round(pos.x), y: Math.round(pos.y),
          w: sz.w, h: sz.h,
          r: rotation, fx: false
        });
      });
    }

    renderAll();

    // 상태 메시지 (renderAll 후 재취득)
    const st = document.getElementById('ai-status');
    if (st) { st.textContent = '✅ 적용 완료'; st.style.color = '#22c55e'; }
  } catch (err) {
    const st = document.getElementById('ai-status');
    if (st) { st.textContent = '❌ ' + err.message; st.style.color = '#ef4444'; }
  } finally {
    aiLoading = false;
  }
}

let selectedOvId = null;

function renderOverlayImgs(t, canvas) {
  (t.overlayImgs || []).forEach(oi => {
    const wrap = document.createElement('div');
    wrap.className = 'ov-wrap' + (selectedOvId === oi.id ? ' ov-selected' : '');
    wrap.dataset.ovid = oi.id;
    applyOvStyle(wrap, oi);

    const imgEl = document.createElement('img');
    imgEl.className = 'ov-img-el';
    imgEl.src = encodePath(oi.src);
    wrap.appendChild(imgEl);

    const border = document.createElement('div'); border.className = 'ov-border';
    wrap.appendChild(border);

    // Rotation stem + handle
    const stem = document.createElement('div'); stem.className = 'ov-rot-stem';
    wrap.appendChild(stem);
    const rotH = document.createElement('div'); rotH.className = 'ov-rot-handle';
    rotH.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); startOvRotate(e, oi, canvas); });
    wrap.appendChild(rotH);

    // Controls bar
    const ctrl = document.createElement('div'); ctrl.className = 'ov-controls';
    const flipBtn = document.createElement('button'); flipBtn.className = 'ov-ctrl-btn'; flipBtn.textContent = '↔ 반전';
    flipBtn.addEventListener('mousedown', e => { e.stopPropagation(); oi.fx = !oi.fx; renderAll(); });
    const sep = document.createElement('div'); sep.className = 'ov-ctrl-sep';
    const delBtn = document.createElement('button'); delBtn.className = 'ov-ctrl-btn'; delBtn.textContent = '✕ 삭제';
    delBtn.addEventListener('mousedown', e => {
      e.stopPropagation();
      S.tpls[S.cur].overlayImgs = S.tpls[S.cur].overlayImgs.filter(o => o.id !== oi.id);
      selectedOvId = null; renderAll();
    });
    ctrl.appendChild(flipBtn); ctrl.appendChild(sep); ctrl.appendChild(delBtn);
    wrap.appendChild(ctrl);

    // Resize handle (bottom-right)
    const resH = document.createElement('div'); resH.className = 'ov-resize';
    resH.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); startOvResize(e, oi, canvas); });
    wrap.appendChild(resH);

    // Move + select
    wrap.addEventListener('mousedown', e => {
      if (e.target === resH || e.target === rotH || e.target.classList.contains('ov-ctrl-btn') || e.target.classList.contains('ov-ctrl-sep')) return;
      e.stopPropagation();
      if (selectedOvId !== oi.id) { selectedOvId = oi.id; renderAll(); return; }
      startOvMove(e, oi, canvas);
    });

    canvas.appendChild(wrap);
  });
}

function applyOvStyle(wrap, oi) {
  wrap.style.cssText = `position:absolute;left:${oi.x}px;top:${oi.y}px;width:${oi.w}px;height:${oi.h}px;transform:rotate(${oi.r}deg) scaleX(${oi.fx?-1:1});transform-origin:center center;z-index:100;cursor:move;box-sizing:border-box`;
}

function getOvWrap(canvas, id) {
  return canvas.querySelector(`[data-ovid="${id}"]`);
}

function startOvMove(e, oi, canvas) {
  e.preventDefault();
  const startX = e.clientX - oi.x;
  const startY = e.clientY - oi.y;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const move = ev => {
    oi.x = Math.round(Math.max(-oi.w / 2, Math.min(ev.clientX - startX, W - oi.w / 2)));
    oi.y = Math.round(Math.max(-oi.h / 2, Math.min(ev.clientY - startY, H - oi.h / 2)));
    const w = getOvWrap(canvas, oi.id);
    if (w) { w.style.left = oi.x + 'px'; w.style.top = oi.y + 'px'; }
  };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function startOvResize(e, oi, canvas) {
  const startX = e.clientX, startY = e.clientY;
  const startW = oi.w, startH = oi.h;
  const rad = (oi.r * Math.PI) / 180;
  const move = ev => {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    const lx = dx * Math.cos(rad) + dy * Math.sin(rad);
    const ly = -dx * Math.sin(rad) + dy * Math.cos(rad);
    oi.w = Math.round(Math.max(20, startW + lx));
    oi.h = Math.round(Math.max(20, startH + ly));
    const w = getOvWrap(canvas, oi.id);
    if (w) { w.style.width = oi.w + 'px'; w.style.height = oi.h + 'px'; }
  };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function startOvRotate(e, oi, canvas) {
  const rect = canvas.getBoundingClientRect();
  const cx = rect.left + oi.x + oi.w / 2;
  const cy = rect.top + oi.y + oi.h / 2;
  const move = ev => {
    const angle = Math.atan2(ev.clientY - cy, ev.clientX - cx);
    oi.r = Math.round(angle * 180 / Math.PI + 90);
    const w = getOvWrap(canvas, oi.id);
    if (w) w.style.transform = `rotate(${oi.r}deg) scaleX(${oi.fx ? -1 : 1})`;
  };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function fetchAndAddOverlay(path, x, y) {
  const tpl = S.tpls[S.cur];
  if (!tpl.overlayImgs) tpl.overlayImgs = [];
  const oi = { id: Date.now() + Math.random(), src: path, x: Math.round(Math.max(0, x)), y: Math.round(Math.max(0, y)), w: 100, h: 100, r: 0, fx: false };
  tpl.overlayImgs.push(oi);
  selectedOvId = oi.id;
  renderAll();
}

// Canvas-level deselect + drop (init once)
(function initCanvasListeners() {
  const canvasArea = document.getElementById('canvas-area');
  const canvas = document.getElementById('canvas');

  // Move deselect listener to canvas-area to catch clicks outside popup
  canvasArea.addEventListener('mousedown', e => {
    if (!e.target.closest('.ov-wrap') && selectedOvId !== null) {
      selectedOvId = null; renderAll();
    }
  });

  canvas.addEventListener('dragover', e => e.preventDefault());
  canvas.addEventListener('drop', e => {
    e.preventDefault();
    const path = e.dataTransfer.getData('lib-path');
    if (!path) return;
    const rect = canvas.getBoundingClientRect();
    fetchAndAddOverlay(path, e.clientX - rect.left - 50, e.clientY - rect.top - 50);
  });
})();

function encodePath(p) {
  if (!p || p.startsWith('data:') || p.startsWith('blob:') || p.startsWith('http')) return p;
  return p.split('/').map(encodeURIComponent).join('/');
}

let libActiveCat = null;
let libTargetSlot = null; // null = 오버레이 삽입, 숫자 = 해당 템플릿의 이미지 슬롯 채우기
let libTargetEl   = null; // 현재 선택된 슬롯 DOM 요소

function clearSlotActive() {
  if (libTargetEl) { libTargetEl.classList.remove('slot-active'); libTargetEl = null; }
}

function openLibForSlot(targetId, el) {
  clearSlotActive();
  libTargetSlot = targetId;
  if (el) { libTargetEl = el; el.classList.add('slot-active'); }
  if (!libActiveCat) {
    renderLibCats();
    selectLibCat(Object.keys(LIB_CATS)[0]);
  }
}

function renderLibCats() {
  const catsEl = document.getElementById('lib-cats');
  catsEl.innerHTML = '';
  for (const cat of Object.keys(LIB_CATS)) {
    const btn = document.createElement('div');
    btn.className = 'lib-cat';
    btn.textContent = cat;
    btn.onclick = () => selectLibCat(cat);
    catsEl.appendChild(btn);
  }
}

function selectLibCat(cat) {
  libActiveCat = cat;
  document.querySelectorAll('.lib-cat').forEach(el => el.classList.toggle('active', el.textContent === cat));
  const right = document.getElementById('lib-right');
  right.innerHTML = '';
  const subcats = LIB_CATS[cat];
  for (const [subcat, data] of Object.entries(subcats)) {
    const items = Array.isArray(data) ? data : data.items;
    const dir = Array.isArray(data) ? subcat : (data.path || subcat);
    const btn = document.createElement('button');
    btn.className = 'lib-subcat-btn open';
    btn.textContent = subcat;
    const grid = document.createElement('div');
    grid.className = 'lib-imgs';
    btn.onclick = () => { btn.classList.toggle('open'); grid.classList.toggle('collapsed'); };
    right.appendChild(btn);
    for (const item of items) {
      const path = `3d icons/${cat}/${dir}/${item}.png`;
      const wrapper = document.createElement('div');
      wrapper.className = 'lib-img-item';
      wrapper.title = item;
      wrapper.draggable = true;
      wrapper.addEventListener('dragstart', e => {
        e.dataTransfer.effectAllowed = 'copy';
        e.dataTransfer.setData('lib-path', path);
      });
      const imgEl = document.createElement('img');
      imgEl.src = encodePath(path);
      imgEl.loading = 'lazy';
      imgEl.style.pointerEvents = 'none';
      wrapper.appendChild(imgEl);
      wrapper.onclick = () => applyLibImage(path, wrapper);
      grid.appendChild(wrapper);
    }
    right.appendChild(grid);
  }
}

function applyLibImage(path, itemEl) {
  clearSlotActive(); // 슬롯 선택 강조 해제
  if (libTargetSlot !== null) {
    // 특정 이미지 슬롯에 채우기
    S.tpls[libTargetSlot].image = path;
    libTargetSlot = null;
  } else {
    // 자유 오버레이로 삽입
    const canvas = document.getElementById('canvas');
    const x = Math.round(canvas.offsetWidth / 2 - 50);
    const y = Math.round(canvas.offsetHeight / 2 - 50);
    const tpl = S.tpls[S.cur];
    if (!tpl.overlayImgs) tpl.overlayImgs = [];
    const oi = { id: Date.now() + Math.random(), src: path, x, y, w: 100, h: 100, r: 0, fx: false };
    tpl.overlayImgs.push(oi);
    selectedOvId = oi.id;
  }
  renderAll();
}

// ── Supabase client ──
let _sb = null;
async function getSB() {
  if (_sb) return _sb;
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (!cfg.supabaseUrl) throw new Error('Supabase URL 미설정 (.env에 SUPABASE_URL 입력 필요)');
  _sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  return _sb;
}

function _genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ── Auto-save (localStorage) ──
function scheduleAutoSave() {
  clearTimeout(_autoSaveTimer);
  _autoSaveTimer = setTimeout(() => {
    try { localStorage.setItem(`autosave_${EDITOR_TYPE}`, JSON.stringify({ state: S, savedAt: Date.now(), draftId: currentDraftId })); }
    catch(e) { /* quota */ }
  }, 3000);
}

function checkAutoSaveOnLoad() {
  try {
    const raw = localStorage.getItem(`autosave_${EDITOR_TYPE}`);
    if (!raw) return;
    const data = JSON.parse(raw);
    const ageMins = Math.round((Date.now() - data.savedAt) / 60000);
    if (ageMins > 60 * 24) return;
    const bar = document.createElement('div');
    bar.className = 'restore-bar';
    bar.innerHTML = `<span>💾 ${ageMins < 1 ? '방금' : ageMins + '분'} 전 자동저장된 작업이 있습니다.</span><div class="restore-bar-btns"><button class="rb-yes" id="_rb_yes">복원하기</button><button class="rb-no" id="_rb_no">무시</button></div>`;
    document.body.appendChild(bar);
    document.getElementById('_rb_yes').onclick = () => {
      try { Object.assign(S, data.state); if (data.draftId) { currentDraftId = data.draftId; localStorage.setItem(`draftId_${EDITOR_TYPE}`, currentDraftId); } renderAll(); showToast('✅ 자동저장 상태 복원됨'); } catch(e) {}
      bar.remove();
    };
    document.getElementById('_rb_no').onclick = () => bar.remove();
  } catch(e) {}
}

// ── Toast ──
let _toastTimer;
function showToast(msg, type = '') {
  let t = document.getElementById('_app_toast');
  if (!t) { t = document.createElement('div'); t.id = '_app_toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'toast' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  requestAnimationFrame(() => { t.classList.add('show'); _toastTimer = setTimeout(() => t.classList.remove('show'), 2800); });
}

// ── Status badge ──
function renderStatusBadge() {
  const wrap = document.getElementById('status-badge-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  const st = STATUS_LIST.find(s => s.id === currentStatus) || STATUS_LIST[0];
  const btn = document.createElement('button');
  btn.className = 'status-badge';
  btn.style.cssText = `background:${st.bg};color:${st.color};`;
  btn.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${st.dot};display:inline-block;"></span> ${st.label}`;
  btn.onclick = openStatusDropdown;
  wrap.appendChild(btn);
}

let _stDd = null;
function openStatusDropdown() {
  if (_stDd) { _stDd.remove(); _stDd = null; return; }
  const dd = document.createElement('div');
  dd.className = 'status-dropdown';
  STATUS_LIST.forEach(st => {
    const opt = document.createElement('div');
    opt.className = 'status-opt' + (st.id === currentStatus ? ' s-active' : '');
    opt.innerHTML = `<span class="status-opt-dot" style="background:${st.dot}"></span><span>${st.label}</span>`;
    opt.onclick = () => { setCurrentStatus(st.id); dd.remove(); _stDd = null; };
    dd.appendChild(opt);
  });
  document.body.appendChild(dd);
  const r = document.getElementById('status-badge-wrap').getBoundingClientRect();
  dd.style.top = (r.bottom + 4) + 'px';
  dd.style.left = r.left + 'px';
  _stDd = dd;
  setTimeout(() => document.addEventListener('click', () => { if (_stDd) { _stDd.remove(); _stDd = null; } }, { once: true }), 0);
}

function setCurrentStatus(id) {
  const prev = currentStatus;
  currentStatus = id;
  localStorage.setItem(`draftStatus_${EDITOR_TYPE}`, id);
  renderStatusBadge();
  if (currentDraftId) {
    getSB().then(sb => {
      const now = Date.now();
      sb.from('drafts').select('history').eq('id', currentDraftId).single().then(({ data }) => {
        const hist = data?.history || [];
        hist.push({ status: id, from: prev, changedAt: now, note: '' });
        sb.from('drafts').update({ status: id, history: hist, saved_at: now }).eq('id', currentDraftId).then(() => {});
      });
    }).catch(() => {});
  }
}

function _selSR(el) {
  document.querySelectorAll('.sradio-opt').forEach(o => o.classList.remove('sel'));

}

async function _confirmSave(btn) {
  const ov = btn.closest('.modal-overlay');
  const name = (document.getElementById('_dn_input')?.value || '').trim() || '이름 없음';
  const sel = ov.querySelector('.sradio-opt.sel');
  const newStatus = sel ? sel.dataset.sid : currentStatus;
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    const sb = await getSB();
    const draftId = currentDraftId || _genId();
    const now = Date.now();
    // get existing history
    let history = [];
    if (currentDraftId) {
      const { data } = await sb.from('drafts').select('history,created_at,status').eq('id', currentDraftId).single();
      history = data?.history || [];
      if (data?.status && data.status !== newStatus) history.push({ status: newStatus, from: data.status, changedAt: now, note: '' });
    }
    const { error } = await sb.from('drafts').upsert({
      id: draftId, name, type: EDITOR_TYPE, state: S, status: newStatus,
      history, saved_at: now, created_at: now
    });
    if (error) throw new Error(error.message);
    currentDraftId = draftId;
    localStorage.setItem(`draftId_${EDITOR_TYPE}`, currentDraftId);
    if (newStatus !== currentStatus) { currentStatus = newStatus; localStorage.setItem(`draftStatus_${EDITOR_TYPE}`, newStatus); renderStatusBadge(); }
    ov.remove(); showToast('✅ 임시저장 완료');
  } catch(e) { btn.disabled=false; btn.textContent='저장'; showToast('❌ 저장 실패: ' + e.message, 'error'); }
}

// ── Draft List Modal ──
async function openDraftListModal() {
  const ov = makeOverlay();
  const box = document.createElement('div');
  box.className = 'modal-box'; box.style.width = '480px';
  box.innerHTML = `
    <div class="modal-header">
      <span class="modal-title">저장된 작업 목록</span>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body" id="_dl_body"><div style="text-align:center;padding:32px;color:#8c94a2;font-size:13px;font-family:Pretendard,Inter,sans-serif;">불러오는 중...</div></div>`;
  ov.appendChild(box); document.body.appendChild(ov);
  try {
    const sb = await getSB();
    const { data, error } = await sb.from('drafts').select('id,name,type,status,history,saved_at,created_at').eq('type', EDITOR_TYPE).order('saved_at', { ascending: false });
    if (error) throw new Error(error.message);
    const list = data || [];
    const body = document.getElementById('_dl_body');
    if (!list.length) { body.innerHTML = '<div style="text-align:center;padding:32px;color:#8c94a2;font-size:13px;font-family:Pretendard,Inter,sans-serif;">저장된 작업이 없습니다.</div>'; return; }
    body.innerHTML = '';
    list.forEach(draft => {
      const st = STATUS_LIST.find(s => s.id === draft.status) || STATUS_LIST[0];
      const dt = new Date(draft.saved_at);
      const dateStr = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const item = document.createElement('div');
      item.className = 'draft-item';
      item.innerHTML = `
        <div class="draft-row1">
          <span class="draft-name">${draft.name}</span>
          <span class="draft-time">${dateStr}</span>
        </div>
        <div class="draft-row2">
          <span class="status-badge" style="background:${st.bg};color:${st.color};border:none;font-size:11px;padding:3px 10px;cursor:default;">
            <span style="width:6px;height:6px;border-radius:50%;background:${st.dot};display:inline-block;margin-right:5px;"></span>${st.label}
          </span>
          <div class="draft-actions">
            <button class="d-btn d-hist" onclick="_toggleHist('${draft.id}',this)">이력 ▾</button>
            <button class="d-btn d-del"  onclick="_deleteDraft('${draft.id}',this)">삭제</button>
            <button class="d-btn d-load" onclick="_loadDraft('${draft.id}')">불러오기</button>
          </div>
        </div>
        <div class="hist-panel" id="hp_${draft.id}"></div>`;
      body.appendChild(item);
    });
  } catch(e) { document.getElementById('_dl_body').innerHTML = `<div style="text-align:center;padding:24px;color:#cc0000;font-size:13px;">${e.message}</div>`; }
}

async function _toggleHist(id, btn) {
  const p = document.getElementById('hp_' + id);
  if (p.classList.contains('open')) { p.classList.remove('open'); btn.textContent='이력 ▾'; return; }
  p.innerHTML = '<div style="font-size:12px;color:#8c94a2;padding:4px;">불러오는 중...</div>';
  p.classList.add('open'); btn.textContent = '이력 ▴';
  try {
    const sb = await getSB();
    const { data } = await sb.from('drafts').select('history').eq('id', id).single();
    const hist = data?.history || [];
    if (!hist.length) { p.innerHTML = '<div style="font-size:12px;color:#8c94a2;padding:4px;">변경 이력 없음</div>'; return; }
    p.innerHTML = [...hist].reverse().map(h => {
      const st = STATUS_LIST.find(s=>s.id===h.status)||STATUS_LIST[0];
      const fr = STATUS_LIST.find(s=>s.id===h.from);
      const dt = new Date(h.changedAt);
      const ts = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `<div class="hist-item"><span class="hist-time">${ts}</span><span class="hist-text">${fr?`<span style="color:#8c94a2">${fr.label}</span> → `:''}<span style="color:${st.color};font-weight:600">${st.label}</span>${h.note?` <span style="color:#8c94a2">${h.note}</span>`:''}</span></div>`;
    }).join('');
  } catch(e) { p.innerHTML = '<div style="font-size:12px;color:#cc0000;padding:4px;">오류 발생</div>'; }
}

async function _deleteDraft(id, btn) {
  if (!confirm('이 저장본을 삭제할까요?')) return;
  try {
    const sb = await getSB();
    const { error } = await sb.from('drafts').delete().eq('id', id);
    if (error) throw new Error(error.message);
    btn.closest('.draft-item').remove();
    if (currentDraftId === id) { currentDraftId = null; localStorage.removeItem(`draftId_${EDITOR_TYPE}`); }
    showToast('🗑️ 삭제됐습니다');
  } catch(e) { showToast('❌ 삭제 실패: ' + e.message, 'error'); }
}

async function _loadDraft(id) {
  try {
    const sb = await getSB();
    const { data: draft, error } = await sb.from('drafts').select('*').eq('id', id).single();
    if (error) throw new Error(error.message);
    if (!draft.state) throw new Error('state 없음');
    Object.assign(S, draft.state);
    currentDraftId = draft.id;
    currentStatus = draft.status || 'design-ing';
    localStorage.setItem(`draftId_${EDITOR_TYPE}`, currentDraftId);
    localStorage.setItem(`draftStatus_${EDITOR_TYPE}`, currentStatus);
    renderStatusBadge(); renderAll();
    document.querySelector('.modal-overlay')?.remove();
    showToast(`✅ "${draft.name}" 불러오기 완료`);
  } catch(e) { showToast('❌ 불러오기 실패: ' + e.message, 'error'); }
}

// ── Export ──
// OKFont woff2 → base64 data URL 변환 (청크 방식으로 스택오버플로 방지)
function _bufToB64(buf) {
  let binary = '';
  const bytes = new Uint8Array(buf);
  const CHUNK = 8192;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

// OKFont 3종을 fetch → base64 임베드 CSS 생성
// CDN 폰트(Pretendard)는 포함하지 않아 Safari hang 방지
async function _buildOKFontCSS() {
  const faces = [
    { weight: 300, file: 'font/okfont_web/오케이체 Light.woff2' },
    { weight: 500, file: 'font/okfont_web/오케이체 Medium.woff2' },
    { weight: 700, file: 'font/okfont_web/오케이체 Bold.woff2' },
  ];
  const parts = await Promise.all(faces.map(async ({ weight, file }) => {
    try {
      const res = await fetch(file);
      if (!res.ok) return '';
      const b64 = _bufToB64(await res.arrayBuffer());
      return `@font-face{font-family:'OKFont';src:url('data:font/woff2;base64,${b64}') format('woff2');font-weight:${weight};font-style:normal}`;
    } catch { return ''; }
  }));
  return parts.filter(Boolean).join('\n');
}

async function exportPNG() {
  if (typeof htmlToImage === 'undefined') { showToast('❌ 라이브러리 로드 실패', 'error'); return; }
  showToast('🖼️ PNG 생성 중...');
  try {
    const el = document.getElementById('canvas');
    // OKFont를 base64로 임베드 (CDN 폰트는 스킵 → Safari hang 방지)
    const fontEmbedCSS = await _buildOKFontCSS();
    const opts = {
      pixelRatio: 3,
      quality: 1,
      skipFonts: false,
      fontEmbedCSS,           // OKFont base64 직접 주입
    };
    // 20초 타임아웃
    const dataUrl = await Promise.race([
      htmlToImage.toPng(el, opts),
      new Promise((_, rej) => setTimeout(() => rej(new Error('시간 초과 (20s)')), 20000))
    ]);
    const a = document.createElement('a');
    a.download = `popup_${Date.now()}.png`; a.href = dataUrl; a.click();
    showToast('✅ PNG 저장됐습니다');
  } catch(e) { showToast('❌ PNG 생성 실패: ' + e.message, 'error'); }
}

function exportJSON() {
  const data = { id: currentDraftId, type: EDITOR_TYPE, status: currentStatus, exportedAt: Date.now(), state: S };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `popup_${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ JSON 저장됐습니다');
}

let _expDd = null;
function toggleExportDropdown(anchor) {
  if (_expDd) { _expDd.remove(); _expDd = null; return; }
  const dd = document.createElement('div');
  dd.style.cssText = 'position:fixed;z-index:99998;background:#fff;border:1px solid #e9ebf0;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.14);padding:6px;min-width:168px;';
  [['🖼️ PNG 다운로드', exportPNG], ['📄 JSON 다운로드', exportJSON]].forEach(([lbl, fn]) => {
    const opt = document.createElement('div');
    opt.style.cssText = 'padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Pretendard,Inter,sans-serif;color:#161c26;transition:background .1s;';
    opt.textContent = lbl;
    opt.onmouseover = () => opt.style.background = '#f1f3f5';
    opt.onmouseout  = () => opt.style.background = '';
    opt.onclick = () => { dd.remove(); _expDd = null; fn(); };
    dd.appendChild(opt);
  });
  document.body.appendChild(dd);
  const r = anchor.getBoundingClientRect();
  dd.style.top  = (r.bottom + 4) + 'px';
  dd.style.right = (window.innerWidth - r.right) + 'px';
  _expDd = dd;
  setTimeout(() => document.addEventListener('click', () => { if(_expDd){_expDd.remove();_expDd=null;} }, { once:true }), 0);
}

function makeOverlay() {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  return ov;
}

// ── Init ──
renderAll();
renderStatusBadge();
setTimeout(checkAutoSaveOnLoad, 600);
</script>
