<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오케이저축은행 현수막 디자이너</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
@font-face{font-family:'OKBold';src:url('/imagesAI/fonts/Ok-Bold.woff2')format('woff2');}
@font-face{font-family:'OKMedium';src:url('/imagesAI/fonts/Ok-Medium.woff2')format('woff2');}
@font-face{font-family:'OKLight';src:url('/imagesAI/fonts/Ok-Light.woff2')format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;}
input,textarea,select,button{font-family:inherit;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;background:#15151a;}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;overflow:hidden;}
.sidebar{background:#1c1b20;border-right:1px solid #33323a;padding:12px;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#4a4850 transparent;}
.main{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100vh;overflow-y:auto;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#4a4850 transparent;}

/* 커스텀 스크롤바 (webkit 계열) */
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:7px;}
.sidebar::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:#3a393f;border-radius:10px;border:2px solid transparent;background-clip:content-box;}
.sidebar::-webkit-scrollbar-thumb:hover,.main::-webkit-scrollbar-thumb:hover{background:#F04E2D;background-clip:content-box;}
.box{background:#232228;border:1px solid #33323a;border-radius:9px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.box:last-child{margin-bottom:0;}
.sec-title{font-size:12px;font-weight:700;color:#EDEDEF;margin:0 0 9px;padding-bottom:5px;border-bottom:1px solid #33323a;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.sec-title .chev{font-size:10px;color:#6a6870;transition:transform .15s;}
.box.collapsed .sec-title{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.box.collapsed .chev{transform:rotate(-90deg);}
.box.collapsed>:not(.sec-title){display:none;}
.reset-btn{width:100%;padding:8px;border:1px solid #3a393f;border-radius:7px;background:#232228;color:#cfcdd1;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.reset-btn:hover{background:#2c2c33;border-color:#55545c;}
.reset-btn:active{transform:scale(0.98);}
.field-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.field-row label{font-size:11px;color:#a8a6ac;min-width:40px;}
.field-row input[type=number]{width:64px;padding:4px 6px;border:1px solid #3a393f;border-radius:5px;font-size:12px;background:#2a2a30;color:#EDEDEF;}
.slider-row{margin-bottom:9px;}
.lbl{font-size:11px;color:#a8a6ac;margin-bottom:4px;}
.sv{font-weight:700;color:#F04E2D;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;background:#33323a;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:#F04E2D;border:2px solid #232228;box-shadow:0 0 0 1px #3a393f;cursor:pointer;}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#F04E2D;border:2px solid #232228;box-shadow:0 0 0 1px #3a393f;cursor:pointer;}
input[type=range]:focus-visible{outline:2px solid #F04E2D;outline-offset:2px;}
.check-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:12px;color:#b8b6ba;}
.upload-btn{width:100%;padding:6px;border:1px dashed #55545c;border-radius:5px;background:#232228;color:#a8a6ac;font-size:12px;cursor:pointer;text-align:center;margin-bottom:6px;}
.wb{flex:1;padding:5px;border:1px solid #3a393f;border-radius:5px;background:#232228;color:#cfcdd1;font-size:12px;cursor:pointer;}
.wb.on{background:#F04E2D;color:#fff;border-color:#F04E2D;}
.wbtns{display:flex;gap:4px;margin-bottom:7px;}
.ti{width:100%;padding:5px 7px;border:1px solid #3a393f;border-radius:5px;font-size:12px;margin-bottom:5px;background:#2a2a30;color:#EDEDEF;}
textarea.ti{min-height:50px;resize:vertical;}
.dl-section{border-top:1px solid #33323a;margin-top:8px;padding-top:8px;}
.dl-note{font-size:10px;color:#7c7a80;margin-bottom:6px;}
.dl-btn{width:100%;padding:8px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:4px;border:none;}
.dl-p{background:#F04E2D;color:#fff;}
.dl-s{background:#2a2a30;color:#EDEDEF;border:1px solid #3a393f;}
.dl-btn:hover{opacity:.88;}
.preview-info{font-size:11px;color:#9c9aa0;text-align:center;}
.canvas-wrap{background:#fff;border:1px solid #3a393f;border-radius:6px;overflow:hidden;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.35);}
canvas{display:block;width:100%;height:auto;}
.cprow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.divider{height:1px;background:#33323a;margin:8px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="box">
      <button class="reset-btn" onclick="resetAll()">↺ 전체 초기화</button>
    </div>

    <div class="box">
      <div class="sec-title" onclick="this.parentNode.classList.toggle('collapsed')"><span>📐 규격 설정</span><span class="chev">▾</span></div>
      <div class="field-row"><label>가로(cm)</label><input type="number" id="wCm" value="304" min="50" max="2000" oninput="sd()"></div>
      <div class="field-row"><label>세로(cm)</label><input type="number" id="hCm" value="69" min="30" max="2000" oninput="sd()"></div>
      <div id="sizeLabel" style="font-size:10px;color:#9c9aa0;margin-bottom:5px;">가로형 — 304×69cm</div>
      <div class="slider-row">
        <div class="lbl">안전영역: <span class="sv" id="safeV">25</span>mm</div>
        <input type="range" id="safe" min="0" max="60" value="25" oninput="document.getElementById('safeV').textContent=this.value;sd()">
      </div>
      <div class="check-row"><input type="checkbox" id="showSafe" checked onchange="sd()"><span>안전영역 가이드라인 표시</span></div>
    </div>

    <div class="box">
      <div class="sec-title" onclick="this.parentNode.classList.toggle('collapsed')"><span>🏷️ 로고 설정</span><span class="chev">▾</span></div>
      <div class="lbl" style="margin-bottom:4px;">로고 선택</div>
      <select id="logoPresetSel" class="ti" style="margin-bottom:8px;" onchange="setLogoPreset(this.value)">
        <option value="group">OK금융그룹</option>
        <option value="savings" selected>OK저축은행</option>
        <option value="holdings">OK홀딩스</option>
      </select>
      <button class="upload-btn" onclick="document.getElementById('logoFile').click()">⬆ 로고 업로드</button>
      <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="loadLogo(this)">
      <div class="slider-row" style="margin-top:8px;">
        <div class="lbl">로고 크기: <span class="sv" id="logoScaleV">70</span>%</div>
        <input type="range" id="logoScale" min="20" max="150" value="70" step="5" oninput="document.getElementById('logoScaleV').textContent=this.value;sd()">
      </div>
    </div>

    <div class="box collapsed">
      <div class="sec-title" onclick="this.parentNode.classList.toggle('collapsed')"><span>🟧 좌측 배경</span><span class="chev">▾</span></div>
      <div class="slider-row">
        <div class="lbl">배경 크기: <span class="sv" id="bgScaleV">100</span>%</div>
        <input type="range" id="bgScale" min="50" max="300" value="100" step="5" oninput="document.getElementById('bgScaleV').textContent=this.value;sd()">
      </div>
    </div>

    <div class="box">
      <div class="sec-title" onclick="this.parentNode.classList.toggle('collapsed')"><span>T 서브 텍스트</span><span class="chev">▾</span></div>
      <input class="ti" type="text" id="subTxt" value="오케이저축은행 배너 테스트" oninput="sd()">
      <div class="lbl" style="margin-bottom:4px;">굵기</div>
      <div class="wbtns">
        <button class="wb" id="sub_light" onclick="setSub('OKLight')">Light</button>
        <button class="wb on" id="sub_medium" onclick="setSub('OKMedium')">Medium</button>
        <button class="wb" id="sub_bold" onclick="setSub('OKBold')">Bold</button>
      </div>
      <div class="slider-row">
        <div class="lbl">글자 크기: <span class="sv" id="subFszV">14</span></div>
        <input type="range" id="subFsz" min="1" max="80" value="14" oninput="document.getElementById('subFszV').textContent=this.value;sd()">
      </div>
      <div class="slider-row">
        <div class="lbl">자간: <span class="sv" id="subLspV">0</span></div>
        <input type="range" id="subLsp" min="-50" max="40" value="0" oninput="document.getElementById('subLspV').textContent=this.value;sd()">
      </div>
    </div>

    <div class="box">
      <div class="sec-title" onclick="this.parentNode.classList.toggle('collapsed')"><span>T 메인 텍스트</span><span class="chev">▾</span></div>
      <textarea class="ti" id="mainTxt" oninput="sd()">오케이저축은행 배너 테스트</textarea>
      <div class="lbl" style="margin-bottom:4px;">굵기</div>
      <div class="wbtns">
        <button class="wb" id="main_light" onclick="setMain('OKLight')">Light</button>
        <button class="wb" id="main_medium" onclick="setMain('OKMedium')">Medium</button>
        <button class="wb on" id="main_bold" onclick="setMain('OKBold')">Bold</button>
      </div>
      <div class="slider-row">
        <div class="lbl">글자 크기: <span class="sv" id="mainFszV">32</span></div>
        <input type="range" id="mainFsz" min="1" max="120" value="32" oninput="document.getElementById('mainFszV').textContent=this.value;sd()">
      </div>
      <div class="slider-row">
        <div class="lbl">자간: <span class="sv" id="mainLspV">0</span></div>
        <input type="range" id="mainLsp" min="-50" max="40" value="0" oninput="document.getElementById('mainLspV').textContent=this.value;sd()">
      </div>
    </div>

    <div class="box collapsed">
      <div class="sec-title" onclick="this.parentNode.classList.toggle('collapsed')"><span>🎨 공통 스타일</span><span class="chev">▾</span></div>
      <div class="slider-row">
        <div class="lbl">서브-메인 간격: <span class="sv" id="subGapV">0</span></div>
        <input type="range" id="subGap" min="-30" max="60" value="0" oninput="document.getElementById('subGapV').textContent=this.value;sd()">
      </div>
      <div class="slider-row">
        <div class="lbl">외곽선 두께: <span class="sv" id="swV">3</span></div>
        <input type="range" id="sw" min="0" max="60" value="3" step="0.5" oninput="document.getElementById('swV').textContent=this.value;sd()">
      </div>
      <div class="lbl" style="margin-bottom:3px;">외곽선 색상</div>
      <div class="cprow">
        <input type="color" id="sc" value="#FFFFFF" oninput="document.getElementById('scHex').textContent=this.value.toUpperCase();sd()" style="width:26px;height:26px;border:none;cursor:pointer;padding:0;">
        <span style="font-size:11px;color:#9c9aa0;" id="scHex">#FFFFFF</span>
      </div>
      <div class="lbl" style="margin-bottom:3px;">글자 색상 (고정)</div>
      <div class="cprow">
        <div style="width:22px;height:22px;background:#55474A;border-radius:4px;border:1px solid #3a393f;"></div>
        <span style="font-size:11px;color:#9c9aa0;">#55474A (고정)</span>
      </div>
    </div>

    <div class="box">
      <div class="dl-note">다운로드 (고화질 16000px)</div>
      <button class="dl-btn dl-p" onclick="dlPDF()">📄 PDF 다운로드</button>
      <button class="dl-btn dl-s" onclick="dlPNG()">📷 PNG 다운로드</button>
    </div>
  </div>

  <div class="main">
    <div class="preview-info" id="previewInfo">304×69cm · 안전영역 25mm</div>
    <div class="canvas-wrap"><canvas id="bc"></canvas></div>
  </div>
</div>

<script>
const BG_SRC = '/imagesAI/logo/bg.svg';
const LOGO_SRC_GROUP = '/imagesAI/logo/logo-group.svg';
const LOGO_SRC_HOLDINGS = '/imagesAI/logo/logo-holdings.svg';
const LOGO_SRC = '/imagesAI/logo/logo-savings.svg';

let bgImg = null, defaultLogoImg = null, uploadedLogoImg = null;
let groupLogoImg = null, holdingsLogoImg = null;
let logoPreset = 'savings'; // 'group' | 'savings' | 'holdings'
let subFont = 'OKMedium', mainFont = 'OKBold';
let timer = null;

// 에셋 로드
const _bg = new Image();
_bg.onload = () => { bgImg = _bg; sd(); };
_bg.src = BG_SRC;

const _logo = new Image();
_logo.onload = () => { defaultLogoImg = _logo; sd(); };
_logo.src = LOGO_SRC;

const _logoGroup = new Image();
_logoGroup.onload = () => { groupLogoImg = _logoGroup; sd(); };
_logoGroup.src = LOGO_SRC_GROUP;

const _logoHoldings = new Image();
_logoHoldings.onload = () => { holdingsLogoImg = _logoHoldings; sd(); };
_logoHoldings.src = LOGO_SRC_HOLDINGS;

function setSub(f) {
  subFont = f;
  ['light','medium','bold'].forEach(k => document.getElementById('sub_'+k).classList.remove('on'));
  document.getElementById('sub_'+{OKLight:'light',OKMedium:'medium',OKBold:'bold'}[f]).classList.add('on');
  sd();
}
function setMain(f) {
  mainFont = f;
  ['light','medium','bold'].forEach(k => document.getElementById('main_'+k).classList.remove('on'));
  document.getElementById('main_'+{OKLight:'light',OKMedium:'medium',OKBold:'bold'}[f]).classList.add('on');
  sd();
}
function setLogoPreset(key) {
  logoPreset = key;
  uploadedLogoImg = null;
  document.getElementById('logoFile').value = '';
  document.getElementById('logoPresetSel').value = key;
  sd();
}
function loadLogo(input) {
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => { const i = new Image(); i.onload = () => { uploadedLogoImg = i; sd(); }; i.src = e.target.result; };
  r.readAsDataURL(file);
}
function sd() { clearTimeout(timer); timer = setTimeout(() => draw(false), 30); }

// 전체 초기화: 모든 컨트롤을 기본값으로 되돌림
const DEFAULTS = {
  wCm:304, hCm:69, safe:25, showSafe:true,
  subTxt:'오케이저축은행 배너 테스트', subFsz:14, subLsp:0, subFont:'OKMedium',
  mainTxt:'오케이저축은행 배너 테스트', mainFsz:32, mainLsp:0, mainFont:'OKBold',
  subGap:0, sw:3, sc:'#FFFFFF', bgScale:100, logoScale:70
};
function resetAll() {
  const d = DEFAULTS;
  document.getElementById('wCm').value = d.wCm;
  document.getElementById('hCm').value = d.hCm;
  document.getElementById('safe').value = d.safe;
  document.getElementById('safeV').textContent = d.safe;
  document.getElementById('showSafe').checked = d.showSafe;
  document.getElementById('subTxt').value = d.subTxt;
  document.getElementById('subFsz').value = d.subFsz;
  document.getElementById('subFszV').textContent = d.subFsz;
  document.getElementById('subLsp').value = d.subLsp;
  document.getElementById('subLspV').textContent = d.subLsp;
  document.getElementById('mainTxt').value = d.mainTxt;
  document.getElementById('mainFsz').value = d.mainFsz;
  document.getElementById('mainFszV').textContent = d.mainFsz;
  document.getElementById('mainLsp').value = d.mainLsp;
  document.getElementById('mainLspV').textContent = d.mainLsp;
  document.getElementById('subGap').value = d.subGap;
  document.getElementById('subGapV').textContent = d.subGap;
  document.getElementById('sw').value = d.sw;
  document.getElementById('swV').textContent = d.sw;
  document.getElementById('sc').value = d.sc;
  document.getElementById('scHex').textContent = d.sc;
  document.getElementById('bgScale').value = d.bgScale;
  document.getElementById('bgScaleV').textContent = d.bgScale;
  document.getElementById('logoScale').value = d.logoScale;
  document.getElementById('logoScaleV').textContent = d.logoScale;
  document.getElementById('logoFile').value = '';
  uploadedLogoImg = null;
  setLogoPreset('savings');
  setSub(d.subFont);
  setMain(d.mainFont);
}

function gp() {
  return {
    wCm:    parseFloat(document.getElementById('wCm').value) || 304,
    hCm:    parseFloat(document.getElementById('hCm').value) || 69,
    safe:   parseInt(document.getElementById('safe').value),
    showSafe: document.getElementById('showSafe').checked,
    subTxt: document.getElementById('subTxt').value,
    mainTxt:document.getElementById('mainTxt').value,
    subFsz: parseFloat(document.getElementById('subFsz').value),
    mainFsz:parseFloat(document.getElementById('mainFsz').value),
    subLsp: parseFloat(document.getElementById('subLsp').value),
    mainLsp:parseFloat(document.getElementById('mainLsp').value),
    subGap: parseFloat(document.getElementById('subGap').value),
    sw:     parseFloat(document.getElementById('sw').value),
    sc:     document.getElementById('sc').value,
    bgScale:parseFloat(document.getElementById('bgScale').value) / 100,
    logoScale:parseFloat(document.getElementById('logoScale').value) / 100,
  };
}

// 두 패스로 텍스트 렌더: 외곽선 전체 먼저 → 채움색 전체 나중에
function drawTxt(ctx, text, x, y, fsz, sw, sc, fc, font, lsp) {
  if(!text) return;
  ctx.save();
  ctx.font = fsz + "px '" + font + "'";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const chars = [...text];

  // 하한선: 가장 좁은 글자 너비의 50% - 외곽선 두께 (겹침 방지)
  const minCharW = chars.reduce((a,c) => Math.min(a, ctx.measureText(c).width), Infinity);
  const minLsp = -(minCharW * 0.5) + sw;
  const safeLsp = Math.max(lsp, minLsp);

  // 전체 너비 계산
  let tw = chars.reduce((a,c) => a + ctx.measureText(c).width + safeLsp, 0) - safeLsp;
  let startX = x - tw / 2;

  // 1패스: 외곽선
  if(sw > 0) {
    ctx.strokeStyle = sc;
    ctx.lineWidth = sw * 2;
    ctx.lineJoin = 'round';
    let cx = startX;
    chars.forEach(c => {
      const cw = ctx.measureText(c).width;
      ctx.strokeText(c, cx + cw/2, y);
      cx += cw + safeLsp;
    });
  }
  // 2패스: 채움 (항상 위)
  ctx.fillStyle = fc;
  let cx = startX;
  chars.forEach(c => {
    const cw = ctx.measureText(c).width;
    ctx.fillText(c, cx + cw/2, y);
    cx += cw + safeLsp;
  });
  ctx.restore();
}

function draw(hiRes) {
  const p = gp();
  const cv = document.getElementById('bc');
  const W = hiRes ? 16000 : 1400;
  const H = Math.round(W / (p.wCm / p.hCm));
  cv.width = W; cv.height = H;
  cv.style.width = '100%'; cv.style.height = 'auto';
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // 1. 흰 배경
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // 2. 배경 이미지 (맨 뒤, 좌측 정렬 / 세로 중앙, 크기 조절 가능)
  if(bgImg) {
    const bh = H * p.bgScale;
    const bw = bh * bgImg.width / bgImg.height;
    const by = (H - bh) / 2;
    ctx.drawImage(bgImg, 0, by, bw, bh);
  }

  // UI 레이블 업데이트
  const isWide = p.wCm > p.hCm * 1.5;
  document.getElementById('sizeLabel').textContent = (isWide?'가로형':'세로형')+' — '+p.wCm+'×'+p.hCm+'cm';
  document.getElementById('previewInfo').textContent = p.wCm+'×'+p.hCm+'cm · 안전영역 '+p.safe+'mm';

  // 스케일 기준: H/100
  const S = H / 100;

  // 글자 크기 (상한선 적용)
  const mainFsz = Math.min(p.mainFsz * S, H * 0.75);
  const subFsz  = Math.min(p.subFsz  * S, H * 0.4);

  // 외곽선 (최대 4 * S)
  const mainSw = Math.min(p.sw * S, 4 * S);
  const subSw  = Math.min(p.sw * 0.4 * S, 4 * S * 0.4);

  // 자간 스케일
  const mainLsp = p.mainLsp * S;
  const subLsp  = p.subLsp  * S;

  // 위치
  const textX   = W / 2;
  const centerY = H * 0.5;
  const subY    = centerY - mainFsz * 0.5 - subFsz * 0.5 - p.subGap * S;
  const mainY   = centerY + mainFsz * 0.1;

  // 3. 텍스트 렌더
  drawTxt(ctx, p.subTxt,  textX, subY,  subFsz,  subSw,  p.sc, '#E05000', subFont,  subLsp);
  drawTxt(ctx, p.mainTxt, textX, mainY, mainFsz, mainSw, p.sc, '#55474A', mainFont, mainLsp);

  // 4. 로고 (메인텍스트 하단 ~ 안전영역 하단 사이 중앙)
  const safePx    = (p.safe * 0.1 / p.hCm) * H;
  const mainBot   = mainY + mainFsz * 0.5;
  const safeBot   = H - safePx;
  const logoCY    = mainBot + (safeBot - mainBot) / 2;
  const availH    = (safeBot - mainBot) * 0.7;
  const lh        = Math.min(availH, H * 0.18) * p.logoScale;

  if(uploadedLogoImg) {
    const lw = lh * (uploadedLogoImg.width / uploadedLogoImg.height);
    ctx.drawImage(uploadedLogoImg, W/2 - lw/2, logoCY - lh/2, lw, lh);
  } else {
    const presetLogo = logoPreset === 'group' ? groupLogoImg
                      : logoPreset === 'holdings' ? holdingsLogoImg
                      : defaultLogoImg;
    if(presetLogo) {
      const lw = lh * (presetLogo.width / presetLogo.height);
      ctx.drawImage(presetLogo, W/2 - lw/2, logoCY - lh/2, lw, lh);
    }
  }

  // 5. 안전영역 가이드라인
  if(p.showSafe) {
    const sp = (p.safe * 0.1 / p.hCm) * H;
    ctx.save();
    ctx.strokeStyle = 'rgba(0,180,100,0.7)';
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.setLineDash([6,4]);
    ctx.strokeRect(sp, sp, W - sp*2, H - sp*2);
    ctx.fillStyle = 'rgba(0,150,80,0.85)';
    ctx.font = Math.max(10, H*0.015) + 'px monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('안전영역 '+p.safe+'mm', W - sp - 4, sp + 3);
    ctx.restore();
  }
}

function dlPNG() {
  draw(true);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const a = document.createElement('a');
    a.download = 'ok_banner.png';
    a.href = document.getElementById('bc').toDataURL('image/png');
    a.click();
    setTimeout(() => draw(false), 100);
  }));
}

function dlPDF() {
  draw(true);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const cv = document.getElementById('bc');
    const p = gp();
    if(typeof window.jspdf === 'undefined') {
      alert('PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');
      draw(false); return;
    }
    const { jsPDF } = window.jspdf;
    const wMm = p.wCm * 10, hMm = p.hCm * 10;
    const doc = new jsPDF({
      orientation: wMm >= hMm ? 'landscape' : 'portrait',
      unit: 'mm', format: [wMm, hMm], compress: false
    });
    doc.addImage(cv.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, wMm, hMm, undefined, 'NONE');
    doc.save('ok_banner.pdf');
    setTimeout(() => draw(false), 100);
  }));
}

document.fonts.ready.then(() => draw(false));
</script>
